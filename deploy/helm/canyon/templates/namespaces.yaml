{{- /* Canyon's four namespaces and the bundled parts' own. Kept on
     uninstall: they hold the volumes, and deleting a namespace would take its PVCs with it. Each enforces Pod Security
     Admission, warning and auditing at the same level (#2368), as deploy/k8s/namespaces.yaml says why: canyon-apps
     baseline, as an app runs as whatever user its image names; the rest, the bundled parts' included (#2772),
     restricted. */}}
{{- $ns := dict "canyon" "restricted" "canyon-apps" "baseline" "canyon-builds" "restricted" "canyon-scans" "restricted" }}
{{- if or .Values.infra.registry.enabled .Values.infra.canyonPostgres.enabled .Values.infra.appPostgres.enabled }}{{ $_ := set $ns "canyon-infra" "restricted" }}{{ end }}
{{- if .Values.auth.pocketId.enabled }}{{ $_ := set $ns "canyon-auth" "restricted" }}{{ end }}
{{- if .Values.gateway.enabled }}{{ $_ := set $ns "canyon-gateway" "restricted" }}{{ end }}
{{- range $name, $level := $ns }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels: {{- include "canyon.labels" $ | nindent 4 }}
    pod-security.kubernetes.io/enforce: {{ $level }}
    pod-security.kubernetes.io/warn: {{ $level }}
    pod-security.kubernetes.io/audit: {{ $level }}
  annotations: {helm.sh/resource-policy: keep}
{{- end }}
