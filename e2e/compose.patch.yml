# Patching on the E2E stack (e2e/oidc/patch_test.go, design/PATCHING.md §4.8): the stack make e2e-up OIDC=1 started,
# this file over it, which the journey applies itself — patching needs sign-in on (§4.5), so it is the team setup's.
# The journey names the run image: CANYON_E2E_RUN_IMAGE, an image by digest in its own registry; unset, canyon-run.
services:
  server:
    environment:
      - CANYON_PATCHING=on
      - CANYON_PATCH_INTERVAL=1m
      - CANYON_PATCH_WATCH=1m
  executor:
    environment:
      - CANYON_IMAGE_RUN=${CANYON_E2E_RUN_IMAGE:-}
