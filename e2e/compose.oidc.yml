# The E2E stack with sign-in on (make e2e-up OIDC=1): the E2E stack, then the team setup a company runs on one Docker
# server (deploy/docker/team.yml, docs: self-host/docker.md) with the values e2e/fixtures/gen.sh writes as the guide's
# .env holds them (oidc.env, read with --env-file) and the guide's own Caddyfile for localhost, then this. Canyon signs
# people in through the stub's OIDC issuer (e2e/stub, :8443), and e2e/oidc's journey runs against it. A stack
# started without OIDC=1 has other Postgres passwords: make e2e-down first.
services:
  server:
    environment:
      # Canyon at a loopback http address, which oidc allows, so the journey's CLI and browser reach it as the other
      # journeys do; Caddy, the team setup's way in, is published beside it below, and the journey goes through it
      # for what Caddy decides: certificates, and who a request came from.
      - CANYON_PUBLIC_URL=http://localhost:7777
      - CANYON_OIDC_ALLOWED_DOMAINS=e2e.test # who may sign in, fixed, so the journey needs no setup screen
      - SSL_CERT_FILE=/etc/canyon/oidc-ca.pem # the CA the stub's issuer is served under, and nothing else: the stack calls out to no other https
    volumes:
      - ./e2e/.work/fixtures/oidc-ca.pem:/etc/canyon/oidc-ca.pem:ro
    ports:
      - "127.0.0.1:7777:7777" # the team setup publishes none
  caddy:
    ports: !override
      - "127.0.0.1:9443:443" # the journey's https, on loopback: a runner's 80 and 443 are not this test's
  stub:
    ports:
      - "127.0.0.1:8443:8443" # the issuer's authorization endpoint, where the journey's browser is sent
