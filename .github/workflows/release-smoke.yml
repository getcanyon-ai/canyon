name: release-smoke

# The published release as a user downloads it (scripts/release-smoke.sh): CI builds the bundle from the tree and its
# own images, while users take getcanyon-ai/canyon-releases and ghcr.io/getcanyon-ai. release.yml calls it on each
# release it publishes; nightly against latest; by hand against any tag. Nothing of Canyon's source is checked out but
# the scripts it runs.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: The release to test, as tagged on getcanyon-ai/canyon-releases, or latest
        default: latest
  workflow_call:
    inputs:
      tag:
        description: The release to test, as tagged on getcanyon-ai/canyon-releases
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ${{ vars.CANYON_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # our own runners where the repository's CANYON_RUNNERS variable says so; anywhere else, GitHub's: Docker, and the release's linux/arm64 CLI and images
    timeout-minutes: 45 # the four sample apps' builds and two deploys of the test's own app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release-smoke.sh
            scripts/release-archives-check.sh
            scripts/telemetry-off-check.sh
            e2e/compose.telemetry-off.yml
            .github/fetch.sh
          sparse-checkout-cone-mode: false
      - name: helm — the pinned release, checksum-verified
        env:
          HELM_VERSION: v4.0.5
          HELM_SHA256: 206a7747702d13994a93629eaed4259bd9d0aec6e23ca52d640f47f7edfdc863 # linux-arm64 of HELM_VERSION, as helm.yml's; bump both together
        run: |
          set -euo pipefail
          .github/fetch.sh "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz" "$HELM_SHA256" "$RUNNER_TEMP/helm.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/bin" linux-arm64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: scripts/release-smoke.sh "$TAG"
        env:
          TAG: ${{ inputs.tag || 'latest' }}
