name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080

jobs:
  gitleaks:
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's; nothing here is amd64-only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      # Pinned release + checksum rather than a third-party action: no license
      # dependency, and nothing unverified executes in CI.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
        run: |
          set -euo pipefail
          .github/fetch.sh "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz" "$GITLEAKS_SHA256" gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

      # A pull request is judged on its own commits: with fetch-depth 0 every branch is present,
      # so a planted or rotated secret on some other open branch must not fail unrelated PRs.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="origin/${{ github.base_ref }}..HEAD"

      # main keeps the full-history scan: everything that ever landed.
      - name: Scan main's history
        if: github.event_name == 'push'
        run: ./gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="${{ github.sha }}" # main's own history: every other branch is scanned by its pull request, and fetch-depth 0 fetches them all
