{{- /* Caddy, terminating TLS on 80/443 (Service type LoadBalancer: ServiceLB on k3s). Canyon's host goes
     to canyon-server:7777, the app wildcards to canyon-router:80, issued on demand over HTTP-01 per host.
     Before each, Caddy asks Canyon's /tls/ask, which says yes for Canyon's host, an app that exists and the
     front-door check's two addresses alone (contracts/routes.md). Caddy is a pod with no address the server
     could trust on every network, so it asks with the token the chart generates (#2672), read from its
     Secret into the environment and named in the Caddyfile as {env.…}: never a literal in this ConfigMap. */}}
{{- define "canyon.caddyfile" }}
{{- $d := include "canyon.domain" . }}
{{- $canyonHost := .Values.gateway.hosts.canyon | default (include "canyon.publicHost" .) }}
{
	on_demand_tls {
		ask http://canyon-server.canyon.svc.cluster.local:7777/tls/ask?token={env.CANYON_TLS_ASK_TOKEN}
	}
}

{{ $canyonHost }} {
	reverse_proxy canyon-server.canyon.svc.cluster.local:7777
}
{{- if .Values.auth.pocketId.enabled }}

{{ .Values.auth.pocketId.host }}.{{ $d }} {
	reverse_proxy pocket-id.canyon-auth.svc.cluster.local:80
}
{{- end }}
{{- if .Values.headlamp.enabled }}

{{ .Values.gateway.hosts.headlamp }}.{{ $d }} {
	reverse_proxy headlamp.headlamp.svc.cluster.local:80
}
{{- end }}

*.preview.{{ $d }}, *.prod.{{ $d }} {
	tls {
		on_demand
	}
	reverse_proxy canyon-router.canyon.svc.cluster.local:80
}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- $token := include "canyon.tlsAskToken" . }}
apiVersion: v1
kind: Secret
metadata:
  name: canyon-tls-ask
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
  annotations: {helm.sh/resource-policy: keep} # the token stays when the gateway is switched off and on
type: Opaque
stringData:
  token: {{ $token | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: caddy-tls-ask
  namespace: canyon-gateway
  labels: {{- include "canyon.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy
  namespace: canyon-gateway
  labels: {{- include "canyon.labels" . | nindent 4 }}
data:
  Caddyfile: |
    {{- include "canyon.caddyfile" . | nindent 4 }}
---
{{ include "canyon.pvc" (dict "root" . "ns" "canyon-gateway" "name" "caddy-data" "size" .Values.gateway.storage) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: canyon-gateway
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: caddy}}
  template:
    metadata:
      labels: {app: caddy}
      annotations:
        canyon/caddyfile: {{ include "canyon.caddyfile" . | sha256sum | trunc 16 | quote }}
        {{- with include "canyon.tlsAskTokenSum" . }}
        {{ . }} # the token it asks /tls/ask with: a new one rolls it, as it does the server
        {{- end }}
    spec:
      # Pod Security restricted (#2772): Caddy as 65532. Its binary carries the file capability to bind 80 and 443, which
      # an exec refuses unless the container holds it, so the container adds NET_BIND_SERVICE alone, as restricted allows,
      # and starts as the image does, no command of the chart's: an exec through sh would lose the capability.
      # One the image ran as root before wrote /data, its certificates, as root, so an upgrade chowns it first, and Caddy
      # never starts until it has.
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers: {{- include "canyon.ownedOrExit" (dict "root" . "image" "caddy" "dir" "/data") | nindent 8 }}
      containers:
        - name: caddy
          image: {{ include "canyon.image" (dict "root" . "name" "caddy") }}
          env:
            - {name: CANYON_TLS_ASK_TOKEN, valueFrom: {secretKeyRef: {name: caddy-tls-ask, key: token}}}
          ports: [{name: http, containerPort: 80}, {name: https, containerPort: 443}]
          volumeMounts:
            - {name: config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile}
            - {name: data, mountPath: /data}
            - {name: autosave, mountPath: /config}   # XDG_CONFIG_HOME: Caddy's autosave.json, root's alone in the image
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: "1", memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}}
      volumes:
        - {name: config, configMap: {name: caddy}}
        - {name: data, persistentVolumeClaim: {claimName: caddy-data}}
        - {name: autosave, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: canyon-gateway
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector: {app: caddy}
  ports:
    - {name: http, port: 80, targetPort: 80}
    - {name: https, port: 443, targetPort: 443}
{{- end }}
