# Canyon's four namespaces: canyon (the server, the executor, the
# router), canyon-apps (every app and target), canyon-builds (kpack Builds), canyon-scans (scan Jobs).
# Each enforces Pod Security Admission, warning and auditing at the same level (#2368).
apiVersion: v1
kind: Namespace
metadata:
  name: canyon
  labels: {pod-security.kubernetes.io/enforce: restricted, pod-security.kubernetes.io/warn: restricted, pod-security.kubernetes.io/audit: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: canyon-apps
  # baseline, not restricted: an app runs as whatever user its image names, root included, and restricted refuses a
  # container that may run as root (contracts/executor.md, On Kubernetes). baseline still refuses a privileged pod,
  # the host's namespaces and paths, and any capability added.
  labels: {pod-security.kubernetes.io/enforce: baseline, pod-security.kubernetes.io/warn: baseline, pod-security.kubernetes.io/audit: baseline}
---
apiVersion: v1
kind: Namespace
metadata:
  name: canyon-builds
  labels: {pod-security.kubernetes.io/enforce: restricted, pod-security.kubernetes.io/warn: restricted, pod-security.kubernetes.io/audit: restricted}
---
apiVersion: v1
kind: Namespace
metadata:
  name: canyon-scans
  labels: {pod-security.kubernetes.io/enforce: restricted, pod-security.kubernetes.io/warn: restricted, pod-security.kubernetes.io/audit: restricted}
