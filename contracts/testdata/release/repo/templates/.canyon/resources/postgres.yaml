# A postgres resource: a CloudNativePG cluster in the app's namespace, its owner's password generated once by
# External Secrets, which writes the Secret the app reads DATABASE_URL from. Canyon reads canyon.dev/endpoint
# back as where the database is.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ${secret}
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${secret}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ${secret}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: app
        password: "{{ .password }}"
        DATABASE_URL: "postgres://app:{{ .password }}@${service}-${name}-rw.${namespace}.svc:5432/app?sslmode=require"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ${secret}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${service}-${name}
  annotations:
    canyon.dev/endpoint: postgres://${service}-${name}-rw.${namespace}.svc:5432/app
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: ${secret}
