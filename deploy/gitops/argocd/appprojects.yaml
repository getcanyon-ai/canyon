# One AppProject per environment (design/HAND-OFF.md §3b, §10): it reads the deploy repo alone, deploys only into
# canyon-<app>-<env> namespaces, makes no cluster-scoped object, and makes exactly the kinds Canyon commits and the
# reference templates make. Add the kinds your own templates make, and nothing else. Apply it outside the deploy
# repo: whoever can write the deploy repo must not be able to change what it may deploy.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: canyon-preview
  namespace: argocd
spec:
  description: Canyon's previews, from the deploy repo
  sourceRepos:
    - ${REPO_URL}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: canyon-*-preview
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: "", kind: Service}
    - {group: "", kind: ConfigMap}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: generators.external-secrets.io, kind: Password}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: postgresql.cnpg.io, kind: Cluster}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: canyon-prod
  namespace: argocd
spec:
  description: Canyon's production, from the deploy repo
  sourceRepos:
    - ${REPO_URL}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: canyon-*-prod
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
    - {group: "", kind: Service}
    - {group: "", kind: ConfigMap}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: generators.external-secrets.io, kind: Password}
    - {group: gateway.networking.k8s.io, kind: HTTPRoute}
    - {group: postgresql.cnpg.io, kind: Cluster}
