# What cli/skill/canyon.md gives a static single-page app: nginx serves what the build writes to dist,
# and a client-side route answers index.html.
[_]
schema-version = "0.2"

[[io.buildpacks.build.env]]
name = "BP_WEB_SERVER"
value = "nginx"

[[io.buildpacks.build.env]]
name = "BP_WEB_SERVER_ROOT"
value = "dist"

[[io.buildpacks.build.env]]
name = "BP_WEB_SERVER_ENABLE_PUSH_STATE"
value = "true"
