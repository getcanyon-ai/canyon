# A team's Canyon on one Docker server (docs: self-host/docker.md): docker-compose.yml with sign-in through the
# company's identity provider, at https://${CANYON_DOMAIN}, behind Caddy, which ends TLS on the host's 80 and 443.
# The .env beside docker-compose.yml names this file in COMPOSE_FILE and holds every value below; none has a
# default, so a value left out stops compose before anything starts. Compose merges each environment entry by its
# name, so these replace the laptop demo's. A release's download replaces this file and never .env or the Caddyfile.
services:
  postgres:
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${CANYON_POSTGRES_PASSWORD:?set CANYON_POSTGRES_PASSWORD in .env} # read at the volume's first start alone
  app-postgres:
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${CANYON_APP_POSTGRES_PASSWORD:?set CANYON_APP_POSTGRES_PASSWORD in .env} # the same
  server:
    restart: unless-stopped
    environment:
      - CANYON_AUTH=oidc # by name, so the laptop demo's demo never wins the merge
      - CANYON_PUBLIC_URL=https://${CANYON_DOMAIN:?set CANYON_DOMAIN in .env}
      - CANYON_OIDC_ISSUER=${CANYON_OIDC_ISSUER:?set CANYON_OIDC_ISSUER in .env}
      - CANYON_OIDC_CLIENT_ID=${CANYON_OIDC_CLIENT_ID:?set CANYON_OIDC_CLIENT_ID in .env}
      - CANYON_OIDC_CLIENT_SECRET=${CANYON_OIDC_CLIENT_SECRET:-} # empty: a public client, with PKCE
      - CANYON_ADMINS=${CANYON_ADMINS:?set CANYON_ADMINS in .env}
      - CANYON_DEMO_SEED= # a company's Canyon starts with an empty fleet
      - CANYON_DATABASE_URL=postgres://canyon:${CANYON_POSTGRES_PASSWORD}@postgres:5432/canyon?sslmode=disable
      - CANYON_APP_DATABASE_URL=postgres://canyon:${CANYON_APP_POSTGRES_PASSWORD}@app-postgres:5432/canyon?sslmode=disable
      - CANYON_EGRESS_RECEIVER_TOKEN=${CANYON_EGRESS_RECEIVER_TOKEN:?set CANYON_EGRESS_RECEIVER_TOKEN in .env}
      # Caddy, below, at its one pinned address, and nothing else: its X-Forwarded-For names who signed in, so each
      # person has a sign-in rate-limit bucket of their own. Never a range: any address in it could claim to be anyone.
      - CANYON_TRUSTED_PROXIES=10.214.4.2/32
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-} # empty: no AI model, and the AI review shows as skipped
    ports: !reset [] # Caddy is the way in: the server publishes nothing
    networks:
      canyon-edge:
        ipv4_address: 10.214.4.3 # pinned beside Caddy's: started first, the server would take .2 from Docker's allocator
  executor:
    restart: unless-stopped
  egress:
    restart: unless-stopped
  egress-envoy:
    restart: unless-stopped
    environment:
      - CANYON_EGRESS_RECEIVER_TOKEN=${CANYON_EGRESS_RECEIVER_TOKEN:?set CANYON_EGRESS_RECEIVER_TOKEN in .env} # the server's, above
  egress-control:
    restart: unless-stopped
    environment:
      - CANYON_EGRESS_RECEIVER_TOKEN=${CANYON_EGRESS_RECEIVER_TOKEN:?set CANYON_EGRESS_RECEIVER_TOKEN in .env} # the server's, above: its interception listener's access log sends it
  egress-host:
    restart: unless-stopped # egress's floor reads the listing it finds as it starts: after a reboot, the one this wrote last or writes now
  # Caddy ends TLS on the host's 80 and 443 and forwards to the server on canyon-edge, a network the two share with
  # nothing else. It asks the server (GET /tls/ask) before each certificate, so it gets one for Canyon's own host and
  # each app's that exists, and none for a made-up name. The Caddyfile is the guide's, beside .env.
  caddy:
    image: ${CANYON_IMAGE_CADDY:-docker.io/library/caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52}
    container_name: canyon-caddy
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "80:80" # the ACME HTTP-01 challenge, and the redirect to https
      - "443:443"
    volumes:
      - ${CANYON_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - canyon-caddy:/data # the certificates and the ACME account
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks:
      canyon-edge:
        ipv4_address: 10.214.4.2 # the one address CANYON_TRUSTED_PROXIES names

networks:
  canyon-edge: # Caddy and the server, nothing else; outside the apps' pool, inside the egress floor's
    name: canyon-edge
    ipam:
      config:
        - subnet: 10.214.4.0/24

volumes:
  canyon-caddy:
