# One k3s host's backup and restore (docs: self-host/backup-and-upgrade.md, On one k3s host), the guide's own
# blocks run on kind with Calico (.github/kind/backup.sh), then the k3s guide's gateway on the same cluster:
# Caddy pinned to the one address the server trusts, which alone may ask /tls/ask (.github/kind/gateway.sh). Slow, so a pull request runs it only when what it
# proves can change: the manifests and the chart, the schema, the guide and the scripts that run it. Nightly
# on main for the rest: the server's image and what it writes into its volume.
name: backup

on:
  pull_request:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  paths: # which of this workflow's suites the pull request's change reaches (.github/suites): every suite on any other event
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    outputs:
      backup: ${{ steps.reach.outputs.backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its base, which reach.sh diffs
      - id: reach
        run: .github/suites/reach.sh backup

  k3s:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.backup == 'true' # a stack suite: never on a fork's pull request, which runs the fast checks alone
    name: kind (back up and restore one k3s host)
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - if: runner.environment == 'github-hosted' # a fork's pull request; our own VMs have the disk
        name: free the runner's disk, as kube.yml's kind job does
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done
          docker image prune -af >/dev/null &
          wait
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH" # where up.sh puts the pinned kind and kubectl
      - run: .github/kind/up.sh calico
        env:
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
      - run: .github/kind/backup.sh
      - run: .github/kind/gateway.sh
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -40
          kubectl -n canyon logs deploy/canyon-server -c server --tail=100 || true
          kubectl -n canyon logs deploy/canyon-server -c server --previous --tail=50 || true
          kubectl -n canyon-infra logs deploy/canyon-postgres --tail=40 || true
          kubectl -n canyon-infra logs deploy/app-postgres --tail=40 || true
          kubectl -n canyon-gateway logs deploy/caddy --tail=60 || true
