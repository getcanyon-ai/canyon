name: dns-evidence
description: >-
  What a Docker stack job's DNS did, on GitHub's hosted runners, when it failed: the upstreams Docker hands a container
  it creates, the runner's resolver files and when dockerd started, dockerd's resolver lines, and systemd-resolved's
  log. Run it under if: failure(), last. On any other runner it does nothing. (Kept until the hosted-docker fix has
  held through two clean full runs.)
runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        set +e
        since="-3h"
        echo "::group::the runner's resolver files, and when dockerd started"
        ls -l --time-style=full-iso /etc/resolv.conf /run/systemd/resolve/resolv.conf; head -50 /etc/resolv.conf /run/systemd/resolve/resolv.conf
        resolvectl status --no-pager; systemctl show docker -p ActiveEnterTimestamp
        echo "::endgroup::"
        echo "::group::the upstreams Docker hands a container it creates now, on a network like canyon-builds (ExtServers; host(...) is asked from the host)"
        docker network create canyon-dns-evidence >/dev/null && docker run --rm --network canyon-dns-evidence busybox:1.37 cat /etc/resolv.conf
        docker network rm canyon-dns-evidence >/dev/null
        echo "::endgroup::"
        echo "::group::dockerd's resolver lines"; sudo journalctl -u docker --since "$since" --no-pager -o short-iso | grep -i -E 'resolver|dns' | tail -400; echo "::endgroup::"
        echo "::group::systemd-resolved"; resolvectl statistics --no-pager; sudo journalctl -u systemd-resolved --since "$since" --no-pager -o short-iso | tail -200; echo "::endgroup::"
        exit 0
