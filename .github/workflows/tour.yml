# The docs' Take the tour on the laptop demo built from the tree (make tour-check): the chapters canyon demo tour has a new
# visitor's agent run, and the outputs its page pastes. It builds the demo and four sample apps, so a pull request pays
# for it only when it changes the sample, the tour, the page, the words the page pastes, or the MCP server and its
# install, which the tour drives. stack.yml calls it nightly on main, whatever
# the paths, for a change elsewhere that moves those words.
name: tour

on:
  pull_request:
  workflow_call: # stack.yml

permissions:
  contents: read

concurrency:
  group: tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths: # which of this workflow's suites the pull request's change reaches (.github/suites): every suite on any other event
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    outputs:
      tour: ${{ steps.reach.outputs.tour }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its base, which reach.sh diffs
      - id: reach
        run: .github/suites/reach.sh tour

  tour:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.tour == 'true' # a stack suite: never on a fork's pull request, which runs the fast checks alone
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # canyon-arm-ondemand: our own arm64 VMs, on demand for a long job (AGENTS.md, Commands); a fork's pull request stays on GitHub's; every image the demo builds or pulls is multi-arch
    timeout-minutes: 45 # the stack's images, the four sample apps' builds and two tours
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosted-docker # GitHub's hosted runners: Docker resolves a build's lookups from the host (its action.yml)
      - uses: ./.github/actions/go-cache # before setup-go: restoring the module cache over the toolchain setup-go just fetched collides (tar: File exists)
        with:
          job: tour
          build: 'false' # one binary, the CLI: the module cache alone
          save: 'false' # main's jobs write it
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # .github/actions/go-cache instead: main writes, a pull request reads
      - run: make pack-install # pack makes the Node builder the demo's executor builds Node apps on (scripts/builder-node.sh)
        env:
          GH_TOKEN: ${{ github.token }} # an authenticated release download, sent to github.com alone (.github/fetch.sh)
      - run: make tour-check
