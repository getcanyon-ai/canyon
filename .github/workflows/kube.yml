# The executor on a real Kubernetes cluster (contracts/executor.md, invariants 10-11): the images built
# from this tree, deploy/k8s applied, and the kube-tagged tests against it — on kind with Calico, which
# enforces NetworkPolicy, and /probe alone on kind v0.23's kindnet, which does not. On Calico the hand-off
# journey (e2e/handoff) follows; the hand-off journey through a deploy repo runs beside it on a cluster of its own,
# on a pull request and on main, and Canyon under run_by: canyon on clusters of its own, Calico's and kindnet's
# (e2e/handoff/canyon_test.go). Slow, so it runs only when something it proves can change.
name: kube

on:
  pull_request:
    paths:
      - 'executor/**'
      - 'cmd/canyon-executor-kube/**'
      - 'cmd/canyon-identity/**'
      - 'identity/**'
      - 'deploy/k8s/**'
      - 'deploy/egress/**'
      - 'deploy/helm/canyon/**'
      - 'deploy/helm/check-values.yaml'
      - 'Dockerfile.executor-kube'
      - 'Dockerfile.identity'
      - '.github/kind/**'
      - '.github/workflows/kube.yml'
      - 'e2e/handoff/**'
      - 'e2e/ui/handoff/**' # the journey's set-up in the dashboard (#2439), and what it clicks through
      - 'e2e/ui/playwright.config.ts'
      - 'web/src/screens/HandOff*'
      - 'web/src/screens/Settings.tsx'
      - 'web/src/api.ts'
      - 'web/src/strings.ts'
      - 'runs/release.go'
      - 'cmd/canyon-server/routes_release*.go'
      - 'cmd/canyon-server/routes_platform_webhook.go'
      - 'cmd/canyon-server/routes_platform_repo.go'
      - 'runs/repo.go'
      - 'runs/pipeline.go'
      - 'runs/durable.go'
      - 'contracts/**'
      - 'cmd/canyon-server/routes_preferences.go'
      - 'cmd/canyon-server/routes_envs.go' # undeploy
      - 'cmd/canyon-server/routes_projects.go' # delete
      - 'gitops/**' # the deploy repo's commits (#2470), and what Argo CD syncs from them
      - 'internal/gitpush/**'
      - 'deploy/gitops/**'
      - 'internal/egresscontrol/**' # the check beside Envoy, which the kind tests prove enforces (#2386)
      - 'internal/destination/**'
      - 'cmd/canyon-server/egress*.go'
      - 'cmd/canyon-server/routes_egress*.go'
      - 'cmd/canyon-server/routes_front_door.go'
      - 'db/migrations/**'
      - 'webhook/**'
      - 'go.mod'
      - 'Makefile'
  push:
    branches: [main]
    paths:
      - 'executor/**'
      - 'cmd/canyon-executor-kube/**'
      - 'cmd/canyon-identity/**'
      - 'identity/**'
      - 'deploy/k8s/**'
      - 'deploy/egress/**'
      - 'deploy/helm/canyon/**'
      - 'deploy/helm/check-values.yaml'
      - 'Dockerfile.executor-kube'
      - 'Dockerfile.identity'
      - '.github/kind/**'
      - '.github/workflows/kube.yml'
      - 'e2e/handoff/**'
      - 'e2e/ui/handoff/**' # the journey's set-up in the dashboard (#2439), and what it clicks through
      - 'e2e/ui/playwright.config.ts'
      - 'web/src/screens/HandOff*'
      - 'web/src/screens/Settings.tsx'
      - 'web/src/api.ts'
      - 'web/src/strings.ts'
      - 'runs/release.go'
      - 'cmd/canyon-server/routes_release*.go'
      - 'cmd/canyon-server/routes_platform_webhook.go'
      - 'cmd/canyon-server/routes_platform_repo.go'
      - 'runs/repo.go'
      - 'runs/pipeline.go'
      - 'runs/durable.go'
      - 'contracts/**'
      - 'cmd/canyon-server/routes_preferences.go'
      - 'cmd/canyon-server/routes_envs.go' # undeploy
      - 'cmd/canyon-server/routes_projects.go' # delete
      - 'gitops/**' # the deploy repo's commits (#2470), and what Argo CD syncs from them
      - 'internal/gitpush/**'
      - 'deploy/gitops/**'
      - 'internal/egresscontrol/**' # the check beside Envoy, which the kind tests prove enforces (#2386)
      - 'internal/destination/**'
      - 'cmd/canyon-server/egress*.go'
      - 'cmd/canyon-server/routes_egress*.go'
      - 'cmd/canyon-server/routes_front_door.go'
      - 'db/migrations/**'
      - 'webhook/**'
      - 'go.mod'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: kube-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # a PR's newer push cancels its older run; a main run always finishes

jobs:
  kind:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # a stack suite: never on a fork's pull request, which runs the fast checks alone
    strategy:
      fail-fast: false
      # kindnet proves the probe says "not enforced" on a cluster without NetworkPolicy, and that under run_by: canyon
      # nothing builds there and the chart's bootstrap fails closed without failing the upgrade (#2514, #2516): on main
      # and on a pull request, beside it. A pull request runs Calico, the whole suite, which main never re-runs (#2173).
      # kindnet's run on main writes the kube build cache pull requests read.
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"network":"kindnet","network_policy":"not_enforced","run":"TestKindProbeTellsEnforcement"}]' || '[{"network":"calico","network_policy":"enforced","run":"TestKind"},{"network":"kindnet","network_policy":"not_enforced","run":"TestKindProbeTellsEnforcement"}]') }}
    name: kind (${{ matrix.network }})
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # canyon-arm-ondemand: our own arm64 VMs, on demand for a long job (AGENTS.md, Commands); a fork's pull request stays on GitHub's; kind, its node images, Calico and kpack are multi-arch, and kpack's controller is scaled to 0 here: this suite builds no app (build-arch.yml builds one on arm64 and on amd64)
    timeout-minutes: 50 # the journey builds the dashboard and installs Chromium (#2439)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache # before setup-go: restoring the module cache over the toolchain setup-go just fetched collides (tar: File exists)
        with:
          job: kube
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # .github/actions/go-cache instead: main writes, a pull request reads
      - if: runner.environment == 'github-hosted' # a fork's pull request; our own VMs have 100 GiB and none of these directories
        name: free the runner's disk — kind's images, two image builds and Calico need more than it leaves
        run: |
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done # in parallel: serially this was 150 s
          docker image prune -af >/dev/null &
          wait
          df -h /
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH" # where up.sh puts the pinned kind and kubectl, for the tests and the failure step below even when up.sh fails: our runners have neither
      - run: .github/kind/up.sh ${{ matrix.network }}
        env:
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
      - name: helm, the pinned release, checksum-verified as in helm.yml (TestKindSigninRuleFromTheChart applies the chart's canyon-apps-signin)
        if: matrix.network == 'calico' # the suite that runs TestKindSigninRuleFromTheChart; kindnet runs the probe alone
        env:
          HELM_VERSION: v4.0.5
          HELM_SHA256: 206a7747702d13994a93629eaed4259bd9d0aec6e23ca52d640f47f7edfdc863 # linux-arm64 of HELM_VERSION; bump both together
        run: |
          set -euo pipefail
          .github/fetch.sh "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz" "$HELM_SHA256" "$RUNNER_TEMP/helm.tar.gz"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 -C "$HOME/.local/bin" linux-arm64/helm
      - id: suite
        run: make test-kube RUN='${{ matrix.run }}'
        # go test's own -timeout is 30m, and the suite takes about 25 on either kind of runner: a hang past that ends this
        # step, never the job, so the job's log is kept and the step below says what was still running
        timeout-minutes: 35
        env:
          CANYON_KUBE_TEST_PUSH: localhost:5001
          CANYON_KUBE_TEST_DB: 172.30.0.201
          CANYON_KUBE_TEST_SIGNIN: 172.30.0.203
          CANYON_KUBE_TEST_NETWORK_POLICY: ${{ matrix.network_policy }}
          CANYON_KUBE_TEST_LEDGER: kind-pg # up.sh's Canyon Postgres, where the floored apps' envs are named to the egress policy
      - if: failure() && steps.suite.outcome == 'failure'
        name: what was still running when the suite stopped, so a hang names itself
        run: |
          ps -eo pid,ppid,etime,args --forest | grep -E 'go |kube|make|kubectl|helm|docker' | grep -v grep | tail -60 || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -60 || true
      - if: matrix.network == 'kindnet'
        name: under run_by canyon, a deploy builds nothing and the chart's bootstrap fails closed without failing the upgrade (#2514, #2516)
        run: |
          docker run -d --rm --name handoff-db -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=canyon postgres:16-alpine
          until docker exec handoff-db pg_isready -h 127.0.0.1 -U postgres >/dev/null; do sleep 1; done
          go test -tags kindcanyon -count=1 -v -timeout 20m -run '^TestRunByCanyonOnKind$' ./e2e/handoff | tee "$RUNNER_TEMP/canyon.txt"
          grep -q -- '--- PASS: TestRunByCanyonOnKind' "$RUNNER_TEMP/canyon.txt" # a test renamed away runs nothing and passes
        env:
          HANDOFF_DATABASE_URL: postgres://postgres:canyon@127.0.0.1:5432/postgres?sslmode=disable
          CANYON_KUBE_TEST_NETWORK_POLICY: not_enforced
      - if: matrix.network == 'calico' && !cancelled() && steps.suite.outcome != 'skipped'
        name: Envoy lost no access-log entry across the suite (#2377)
        run: |
          # Each replica's stats, its access logs' and the receiver cluster's, printed whether the suite passed or not.
          # A stream to the receiver that failed to open (upstream_rq_pending_failure_eject) lost the entries waiting on
          # it, and logs_dropped counts the entries Envoy dropped itself: either is a call missing from the records,
          # silently, so both must be 0, and a counter not found fails as one that is not. Envoy's image has no curl, so
          # an ephemeral container of the router's image, already on the node, reads the admin socket from the pod's admin volume.
          # egress-control reads the same socket through its own mount: a log line of its that says it could not, on a
          # replica that lost nothing, is a read that fails on a real cluster, so it fails here too.
          set -euo pipefail
          router=$(kubectl -n canyon get deploy canyon-router -o jsonpath='{.spec.template.spec.containers[?(@.name=="nginx")].image}')
          pods=$(kubectl -n canyon get pods -l app.kubernetes.io/name=canyon-egress -o name)
          [ -n "$pods" ] || { echo "::error::no Envoy pod to read"; exit 1; }
          lost=0
          for p in $pods; do
            kubectl -n canyon patch "$p" --subresource=ephemeralcontainers --type=strategic -p '{"spec":{"ephemeralContainers":[{"name":"stats","image":"'"$router"'","command":["curl","-s","--unix-socket","/var/run/envoy-admin/admin.sock","http://x/stats?filter=access_log|ext_authz|receiver"],"volumeMounts":[{"name":"admin","mountPath":"/var/run/envoy-admin"}],"securityContext":{"allowPrivilegeEscalation":false,"capabilities":{"drop":["ALL"]}}}]}}'
            for i in $(seq 30); do kubectl -n canyon logs "$p" -c stats 2>/dev/null | grep -q . && break; sleep 2; done
            stats=$(kubectl -n canyon logs "$p" -c stats)
            echo "== $p"; echo "$stats"
            if ! echo "$stats" | awk -F': ' '
              $1 == "cluster.receiver.upstream_rq_pending_failure_eject" { eject = 1; if ($2 != "0") bad = 1 }
              $1 ~ /^access_logs\.[^.]+\.logs_dropped$/ { dropped = 1; if ($2 != "0") bad = 1 }
              END { exit !(eject && dropped && !bad) }'; then
              echo "::error::$p lost access-log entries on their way to the receiver, or its stats name no such counter: upstream_rq_pending_failure_eject and logs_dropped must be 0"
              lost=1
            fi
            if kubectl -n canyon logs "$p" -c egress-control | grep 'what Envoy lost is not all reported'; then
              echo "::error::$p: egress-control could not read Envoy's stats, or report them"
              lost=1
            fi
          done
          exit "$lost"
      - if: matrix.network == 'calico'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/ui/package-lock.json
      - if: matrix.network == 'calico'
        name: Chromium and its system libraries, for the journey's set-up in the dashboard (e2e/ui's handoff project)
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e/ui
      - if: matrix.network == 'calico'
        name: the hand-off journey (e2e/handoff/README.md)
        run: |
          docker run -d --rm --name handoff-db -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=canyon postgres:16-alpine
          until docker exec handoff-db pg_isready -h 127.0.0.1 -U postgres >/dev/null; do sleep 1; done
          make e2e-handoff
        env:
          HANDOFF_DATABASE_URL: postgres://postgres:canyon@127.0.0.1:5432/postgres?sslmode=disable
      - if: failure()
        run: |
          df -h /
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          for d in kpack-webhook kpack-controller; do # up.sh waits on kpack before canyon's namespace exists
            kubectl -n kpack describe pods -l app=$d || true
            kubectl -n kpack logs deploy/$d --previous --tail=100 || kubectl -n kpack logs deploy/$d --tail=100 || true
          done
          kubectl -n canyon logs deploy/canyon-executor --tail=300
          kubectl -n canyon logs deploy/canyon-server --tail=100
          kubectl -n canyon logs -l app.kubernetes.io/name=canyon-egress --all-containers --prefix --previous --tail=50 || kubectl -n canyon logs -l app.kubernetes.io/name=canyon-egress --all-containers --prefix --tail=50
          kubectl -n canyon logs -l app.kubernetes.io/name=canyon-egress -c egress-control --prefix --tail=-1 || true

  canyon:
    # Canyon under run_by: canyon on Calico (#2514, #2516; e2e/handoff/canyon_test.go): the hand-off journey's stack on
    # this machine with the cluster's own executor, kpack readied as build-arch.yml readies it, so a deploy through the
    # server builds and runs, and the chart's bootstrap saves a door not enforcing again. A pull request's, as Calico's
    # suite; a cluster of its own, so it adds no time to that suite's.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: kind (run_by canyon)
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # as the kind job's
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          job: kube
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - if: runner.environment == 'github-hosted'
        name: free the runner's disk, as the kind job does
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done
          docker image prune -af >/dev/null &
          wait
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: .github/kind/up.sh calico
        env:
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
      - run: .github/kind/build-arch.sh
      - name: under run_by canyon, a deploy builds and runs and the chart's bootstrap heals a door not enforcing (#2514, #2516)
        run: |
          docker run -d --rm --name handoff-db -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=canyon postgres:16-alpine
          until docker exec handoff-db pg_isready -h 127.0.0.1 -U postgres >/dev/null; do sleep 1; done
          go test -tags kindcanyon -count=1 -v -timeout 30m -run '^TestRunByCanyonOnKind$' ./e2e/handoff | tee "$RUNNER_TEMP/canyon.txt"
          grep -q -- '--- PASS: TestRunByCanyonOnKind' "$RUNNER_TEMP/canyon.txt" # a test renamed away runs nothing and passes
        env:
          HANDOFF_DATABASE_URL: postgres://postgres:canyon@127.0.0.1:5432/postgres?sslmode=disable
          CANYON_KUBE_TEST_NETWORK_POLICY: enforced
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          kubectl -n canyon-builds get builds.kpack.io -o wide || true
          kubectl -n kpack logs deploy/kpack-controller --tail=80 || true
          kubectl -n canyon logs deploy/canyon-executor --tail=200

  handoff-repo:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # a stack suite: never on a fork's pull request, which runs the fast checks alone
    # The hand-off journey through a deploy repo (e2e/handoff/README.md; #2470): Calico's cluster, External Secrets and
    # CloudNativePG on it (.github/kind/platform.sh), Gitea beside it, and the deploy repo synced by each GitOps
    # controller deploy/gitops has a reference set-up for, Argo CD and Flux (#2479), each on a cluster of its own. A pull
    # request's, and main's after each merge, so a regression on main never waits for the next PR. Argo CD's keeps the
    # name it always had.
    strategy:
      fail-fast: false
      matrix:
        gitops: [argocd, flux]
    name: kind (hand-off, deploy repo${{ matrix.gitops == 'flux' && ', flux' || '' }})
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # as the kind job's
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache
        with:
          job: kube
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - if: runner.environment == 'github-hosted'
        name: free the runner's disk, as the kind job does
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done
          docker image prune -af >/dev/null &
          wait
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: .github/kind/up.sh calico
        env:
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
      - name: helm, the pinned release, checksum-verified as in the kind job (External Secrets' chart)
        env:
          HELM_VERSION: v4.0.5
          HELM_SHA256: 206a7747702d13994a93629eaed4259bd9d0aec6e23ca52d640f47f7edfdc863 # linux-arm64 of HELM_VERSION; bump both together
        run: |
          set -euo pipefail
          .github/fetch.sh "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz" "$HELM_SHA256" "$RUNNER_TEMP/helm.tar.gz"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 -C "$HOME/.local/bin" linux-arm64/helm
      - run: .github/kind/platform.sh ${{ matrix.gitops }}
        env:
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/ui/package-lock.json
      - name: Chromium and its system libraries, for the journey's set-up in the dashboard (e2e/ui's handoff project)
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e/ui
      - name: the hand-off journey through a deploy repo (e2e/handoff/README.md)
        run: |
          docker run -d --rm --name handoff-db -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=canyon postgres:16-alpine
          until docker exec handoff-db pg_isready -h 127.0.0.1 -U postgres >/dev/null; do sleep 1; done
          make e2e-handoff-repo
        env:
          HANDOFF_DATABASE_URL: postgres://postgres:canyon@127.0.0.1:5432/postgres?sslmode=disable
          HANDOFF_GITOPS: ${{ matrix.gitops }}
      - name: the reference set-up's namespaces chart and Gateway, which kind runs no Gateway API implementation to exercise (#2476), and under Flux its accounts and admission policy (#2479)
        if: ${{ !cancelled() }} # whether the journey passed or not: a check of its own
        run: .github/kind/gitops-check.sh ${{ matrix.gitops }}
      - if: failure()
        run: |
          df -h /
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
      - if: failure() && matrix.gitops == 'flux'
        name: what Flux made of the deploy repo
        run: |
          kubectl -n flux-system get gitrepositories,artifactgenerators,externalartifacts,helmreleases -o yaml || true
          kubectl -n canyon-sync get gitrepositories,kustomizations,resourcequotas -o yaml || true
          kubectl -n canyon-namespaces get secrets || true
          for d in source-controller source-watcher helm-controller kustomize-controller; do
            echo "== $d"; kubectl -n flux-system logs deploy/$d --tail=150 || true
          done
