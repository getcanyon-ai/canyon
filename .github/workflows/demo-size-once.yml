# Temporary, on this branch alone: measures the laptop demo's download and disk, and tries building apps on a builder
# without buildpacks. Nothing here is merged; the branch's last commit deletes it.
name: demo-size-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demo-size-once
  cancel-in-progress: true

jobs:
  measure: # a cold canyon demo up of the published v0.11.1, then down, then down --purge
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'exp/demo-size'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        store: [overlay2, containerd]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: .github/demo-size/prepare.sh ${{ matrix.store }}
      - uses: ./.github/actions/hosted-docker
      - run: .github/demo-size/measure.sh "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-${{ matrix.store }}
          path: ${{ runner.temp }}/out
          retention-days: 3

  trial: # the same builds on today's builder and on the base without buildpacks, plus each app's one language
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'exp/demo-size'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        store: [overlay2, containerd]
        variant: [today, thin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: .github/demo-size/prepare.sh ${{ matrix.store }}
      - uses: ./.github/actions/hosted-docker
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make pack-install
      - run: .github/demo-size/trial.sh ${{ matrix.variant }} "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-${{ matrix.variant }}-${{ matrix.store }}
          path: ${{ runner.temp }}/out
          retention-days: 3
