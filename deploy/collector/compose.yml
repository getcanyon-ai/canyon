# The telemetry collector on one box (#2808): Caddy terminates TLS for COLLECTOR_DOMAIN with a certificate it
# fetches itself, the collector keeps the reports, Postgres holds them. Nothing here names a host: set
#   COLLECTOR_DOMAIN       the domain the collector answers on, its DNS pointing at this box
#   COLLECTOR_READ_KEY     the bearer key GET /v1/weekly takes (openssl rand -hex 32)
#   COLLECTOR_DB_PASSWORD  Postgres's password, never leaving this box
# then, from the repository root: docker compose -f deploy/collector/compose.yml up -d --build
# No container logs the sender's address, which is used in memory alone: Caddy runs from ./Caddyfile, which discards
# every log line (a failed proxy request's names the address), and keeps no container log; the collector writes errors
# alone, never an address. So a certificate Caddy fails to get is logged nowhere either: after each deploy, check that
#   curl -sS -o /dev/null -w '%{http_code}\n' https://$COLLECTOR_DOMAIN/v1/weekly   answers 401 over TLS.
# The collector holds a report to the schema it was built with: once a Canyon server's report grows a field, that
# server's reports are dropped until the collector is rebuilt and redeployed from a tree that has the field.
services:
  collector:
    build:
      context: ../..
      dockerfile: deploy/collector/Dockerfile
    environment:
      CANYON_COLLECTOR_DATABASE_URL: postgres://collector:${COLLECTOR_DB_PASSWORD:?set COLLECTOR_DB_PASSWORD}@db:5432/collector
      CANYON_COLLECTOR_READ_KEY: ${COLLECTOR_READ_KEY:?set COLLECTOR_READ_KEY}
      CANYON_COLLECTOR_PROXIED: "1"
    depends_on: [db]
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: ${COLLECTOR_DB_PASSWORD:?set COLLECTOR_DB_PASSWORD}
      POSTGRES_DB: collector
    volumes: [db:/var/lib/postgresql/data]
    restart: unless-stopped
  front:
    image: caddy:2
    environment:
      COLLECTOR_DOMAIN: ${COLLECTOR_DOMAIN:?set COLLECTOR_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]
    logging: {driver: none}
    depends_on: [collector]
    restart: unless-stopped
volumes:
  db:
  caddy:
