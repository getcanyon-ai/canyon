name: Helm

# The demo chart (deploy/helm/canyon) renders and keeps deploy/k8s's invariants, and a release packs it under
# the release's version; on kind it installs, its bundled parts run under Pod Security, and it upgrades from the
# release before (#2778). It runs only when the chart, the base it is ported from, or what packs it changes.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['deploy/helm/**', 'deploy/k8s/**', 'scripts/chart-package.sh', 'scripts/release-archives-check.sh', '.github/workflows/helm.yml', '.github/helm/**', '.github/kind/chart.sh', '.github/fetch.sh', 'docs/src/content/docs/self-host/backup-and-upgrade.md']

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  paths: # which of this workflow's suites the pull request's change reaches (.github/suites): every suite on any other event
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    outputs:
      helm: ${{ steps.reach.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its base, which reach.sh diffs
      - id: reach
        run: .github/suites/reach.sh helm

  chart:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !contains(github.event.pull_request.labels.*.name, 'ci:private')) && (needs.paths.outputs.helm == 'true')
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: helm — the pinned release, checksum-verified
        env:
          HELM_VERSION: v4.0.5
          HELM_SHA256: 206a7747702d13994a93629eaed4259bd9d0aec6e23ca52d640f47f7edfdc863 # linux-arm64 of HELM_VERSION; bump both together
        run: |
          set -euo pipefail
          .github/fetch.sh "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz" "$HELM_SHA256" helm.tar.gz
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf helm.tar.gz --strip-components=1 -C "$RUNNER_TEMP/bin" linux-arm64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: .github/helm/chart-check.sh # every check of the chart that needs no cluster, as Canyon's private runners run it too (scripts/ci-suite.sh helm-chart)

  install:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.helm == 'true' # a stack suite: never on a fork's pull request, which runs the fast checks alone
    name: the chart on kind, its bundled parts running, and the upgrade from the release before (#2778)
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # as the chart job's
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: helm — the pinned release, checksum-verified, as the chart job's
        env:
          HELM_VERSION: v4.0.5
          HELM_SHA256: 206a7747702d13994a93629eaed4259bd9d0aec6e23ca52d640f47f7edfdc863 # linux-arm64 of HELM_VERSION; bump both together, and the chart job's
        run: |
          set -euo pipefail
          .github/fetch.sh "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz" "$HELM_SHA256" helm.tar.gz
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf helm.tar.gz --strip-components=1 -C "$RUNNER_TEMP/bin" linux-arm64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH" # where chart.sh puts the pinned kind and kubectl, for the failure step below too
      - name: the release before installed, data in its volumes, this tree's chart over it; the volume-owned guard and its documented chown; the bootstrap Job judged by Pod Security (.github/kind/chart.sh)
        env:
          GH_TOKEN: ${{ github.token }} # the release before's chart and images.txt, from the public canyon-releases
        run: .github/kind/chart.sh
      - if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 80 || true
      - if: always()
        run: kind delete cluster || true
