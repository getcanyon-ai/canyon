name: Canyon didn't install or start
description: An install, an upgrade or a start that failed.
labels: [install-failed]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you ran, and what it printed
      description: Commands and output, as exactly as you can. Remove every secret and private URL first.
      render: text
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where Canyon runs
      options:
        - The demo on a laptop (docker compose)
        - Kubernetes
        - The demo Helm chart
        - Somewhere else (say where above)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Canyon version
      description: The output of `canyon --version`, or the release you installed.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
