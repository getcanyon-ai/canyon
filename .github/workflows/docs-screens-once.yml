# Temporary, on this branch alone: takes the docs' dashboard screenshots on the demo built from this tree and uploads
# them. The commit that adds the pictures deletes it.
name: docs-screens-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  screens:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/screens-v0.11.1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -p canyon-docs-screens -f docker-compose.yml -f e2e/compose.telemetry-off.yml --profile demo-apps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/hosted-docker
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: the demo, built from this tree, sending no usage report
        run: $COMPOSE up -d --build
      - name: the sample apps deploy
        run: |
          code=$(timeout 2700 docker wait canyon-docs-screens-demo-apps-1)
          docker logs --tail 40 canyon-docs-screens-demo-apps-1
          [ "$code" = 0 ] || { echo "::error::demo-apps exited $code"; exit 1; }
      - name: the fleet is the one the docs describe, seven apps with claims-portal blocked
        run: |
          curl -fsS http://localhost:7777/api/v1/fleet > fleet.json
          jq '[.apps[] | {name, gate_state, envs: (.envs | keys)}], .tiles' fleet.json
          jq -e '(.apps | length) == 7 and ([.apps[] | select(.name == "claims-portal") | .gate_state] == ["blocked"])' fleet.json
      - run: cd e2e/ui && npm ci --silent && npx playwright install --with-deps chromium
      - run: make docs-screens
      - uses: actions/upload-artifact@v4
        with:
          name: docs-screens
          path: docs/public/screens/*.webp
          if-no-files-found: error
          retention-days: 3
      - if: failure()
        run: $COMPOSE logs --no-color --tail=80 server executor demo-apps
      - if: always()
        run: $COMPOSE down -v
