# Temporary, on this branch alone: canyon demo down --purge on each of Docker's image stores, with a person's tag and a
# stopped team Canyon at the demo's digests. The branch's last commit deletes it.
name: purge-check-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  purge:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/demo-purge-170'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        store: [overlay2, containerd]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/hosted-docker
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: bash .github/purge-check/run.sh ${{ matrix.store }}
