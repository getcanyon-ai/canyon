# From kpack v0.18.0 release.yaml (sha256 cde8b7df8d31d6a5758ec4880eec45009f17811baf3df5a29b76a144fe200e69), split by kind.
apiVersion: v1
kind: Namespace
metadata:
  name: kpack
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.25
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-logging
  namespace: kpack
data:
  zap-logger-config: "{\n  \"level\": \"info\",\n  \"development\": false,\n  \"outputPaths\"\
    : [\"stdout\"],\n  \"errorOutputPaths\": [\"stderr\"],\n  \"encoding\": \"json\"\
    ,\n  \"encoderConfig\": {\n    \"timeKey\": \"ts\",\n    \"levelKey\": \"level\"\
    ,\n    \"nameKey\": \"logger\",\n    \"callerKey\": \"caller\",\n    \"messageKey\"\
    : \"msg\",\n    \"stacktraceKey\": \"stacktrace\",\n    \"lineEnding\": \"\",\n\
    \    \"levelEncoder\": \"\",\n    \"timeEncoder\": \"rfc3339nano\",\n    \"durationEncoder\"\
    : \"\",\n    \"callerEncoder\": \"\"\n  }\n}\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-init-image
  namespace: kpack
data:
  image: ghcr.io/buildpacks-community/kpack/build-init@sha256:759d5a326c77a83066ca718826f102449c6dac7b7a8ec19a8ae116058a111cab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-waiter-image
  namespace: kpack
data:
  image: ghcr.io/buildpacks-community/kpack/build-waiter@sha256:a3220465f0a7b523073e9d96738fc9b1114d842d1846b5a38e1f1a245cb8bc85
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rebase-image
  namespace: kpack
data:
  image: ghcr.io/buildpacks-community/kpack/rebase@sha256:3b455a140c8e4698470517af16f5740e5975c419fd162910bad129b5474181b1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: completion-image
  namespace: kpack
data:
  image: ghcr.io/buildpacks-community/kpack/completion@sha256:544722e901cc6fb81b3293909d4ac058f48bcc90314bf2bebd1d24d426519fd6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kpack-controller
  namespace: kpack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kpack-controller
  template:
    metadata:
      labels:
        app: kpack-controller
        version: 0.18.0
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      priorityClassName: kpack-control-plane
      serviceAccountName: controller
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: controller
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          privileged: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        image: ghcr.io/buildpacks-community/kpack/controller@sha256:e569159f863d563449fe6456f35f27677776d6bba5674eaa62ce39e2bfec70bb
        env:
        - name: ENABLE_PRIORITY_CLASSES
          value: 'false'
        - name: INJECTED_SIDECAR_SUPPORT
          value: 'false'
        - name: EXPERIMENTAL_GENERATE_SLSA_ATTESTATION
          value: 'false'
        - name: INSECURE_SSH_TRUST_UNKNOWN_HOSTS
          value: 'true'
        - name: CONFIG_LOGGING_NAME
          value: config-logging
        - name: CONFIG_OBSERVABILITY_NAME
          value: config-observability
        - name: METRICS_DOMAIN
          value: kpack.io
        - name: SCALING_FACTOR
          value: '1'
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SYSTEM_SERVICE_ACCOUNT
          value: controller
        - name: BUILD_INIT_IMAGE
          valueFrom:
            configMapKeyRef:
              name: build-init-image
              key: image
        - name: BUILD_WAITER_IMAGE
          valueFrom:
            configMapKeyRef:
              name: build-waiter-image
              key: image
        - name: REBASE_IMAGE
          valueFrom:
            configMapKeyRef:
              name: rebase-image
              key: image
        - name: COMPLETION_IMAGE
          valueFrom:
            configMapKeyRef:
              name: completion-image
              key: image
        resources:
          requests:
            cpu: 20m
            memory: 1Gi
          limits:
            memory: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: kpack
---
