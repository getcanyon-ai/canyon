# The contributor licence agreement (CLA.md): a pull request's authors each sign it once, by the comment
# below, and the check stays red until they have. Signatures are a JSON file on this repository's
# cla-signatures branch, written with the workflow's own GITHUB_TOKEN: no other token. The job creates the branch
# itself the first time, as github-actions[bot], since the action can't; it stays outside the main ruleset, which
# protects the default branch alone. It runs only in the public
# repository, getcanyon-ai/canyon, and on GitHub's runners: pull_request_target runs with this repository's
# token on a fork's pull request, so it never checks out or runs the pull request's code.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write # the signatures file on the cla-signatures branch, nothing else
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Dependabot's own pull requests are skipped, by the account that opened them (a skipped required check passes):
    # its commits are its own, and it can't sign.
    if: >-
      github.repository == 'getcanyon-ai/canyon' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.issue.user.login != 'dependabot[bot]' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-24.04
    steps:
      - name: The signatures branch, created by this workflow the first time
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/cla-signatures" >/dev/null 2>&1 && exit 0
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/cla-signatures -f sha="$main" --jq .ref
      # contributor-assistant/github-action v2.6.1 (Apache-2.0), pinned by commit. Its upstream is archived and it
      # declares node20, which GitHub is retiring: replace it with a maintained action once one exists.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/getcanyon-ai/canyon/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          # No allowlist: the action matches its patterns, unanchored, against an author's login or, for an email
          # linked to no account, the git author name a commit claims, so "*[bot]" let a commit authored "x[bot]"
          # pass unsigned. Dependabot's pull requests are skipped above, by who opened them, which nobody can claim.
