# The latest released CLI against this tree's server (.github/old-cli.sh): what a server change does to the
# CLI people already have installed. It runs when the server can change: the packages canyon-server is
# built from (go list -deps ./cmd/canyon-server, less web/, which the CLI never reads), its images and
# the compose stack, and the demo apps it drives. Test files and prose change nothing the CLI talks to.
name: old-cli

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: old-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths: # which of this workflow's suites the pull request's change reaches (.github/suites): every suite on any other event
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    outputs:
      old-cli: ${{ steps.reach.outputs.old-cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its base, which reach.sh diffs
      - id: reach
        run: .github/suites/reach.sh old-cli

  old-cli:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.old-cli == 'true' # a stack suite: never on a fork's pull request, which runs the fast checks alone
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # canyon-arm-ondemand: our own arm64 VMs, on demand for a long job (AGENTS.md, Commands); a fork's pull request stays on GitHub's; the stack's images and the release's CLI are both arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosted-docker # GitHub's hosted runners: Docker resolves a build's lookups from the host (its action.yml)
      - run: .github/old-cli.sh
        env:
          GH_TOKEN: ${{ github.token }}
