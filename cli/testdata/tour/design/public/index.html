<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims tracker</title>
<link rel="stylesheet" href="canyon.css">
<h1>Claims tracker</h1>
<p>Motor claims.</p>
<ul></ul>
<script>
  const list = document.querySelector("ul");
  (async () => {
    const claims = await (await fetch("/claims")).json();
    list.replaceChildren(...claims.map((c) => {
      const item = document.createElement("li");
      item.textContent = `${c.policy_number}: ${c.claim} (${c.status})`;
      return item;
    }));
  })();
</script>
