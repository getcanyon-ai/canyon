# The AI reviewer's secret detector: gitleaks' default rules plus one, a password in a URL's userinfo.
[extend]
useDefault = true

[[rules]]
id = "url-userinfo-password"
description = "A URL whose userinfo carries a password (scheme://user:password@host); the password is the secret."
regex = '''[a-zA-Z][a-zA-Z0-9+.-]*://[^\s:@/"'`]+:([^\s@/"'`]+)@'''
secretGroup = 1
keywords = ["://"]
