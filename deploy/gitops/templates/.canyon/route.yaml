# How people reach each app: a Gateway API HTTPRoute on the org's gateway, its environment's listener
# (gateway/gateway.yaml), to the sign-in sidecar's port. Canyon reads canyon.dev/address back as the app's
# address. Edit the domain and the gateway to your own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${service}
  annotations:
    canyon.dev/address: https://${app}.${env}.apps.example.com
spec:
  parentRefs:
    - name: apps
      namespace: gateway
      sectionName: ${env}
  hostnames:
    - ${app}.${env}.apps.example.com
  rules:
    - backendRefs:
        - name: ${service}
          port: 4180
