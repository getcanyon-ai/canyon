# A rebase patch end to end on Docker (e2e/oidc/patch_test.go, design/PATCHING.md §4.8, #2108): the team setup's stack
# (make e2e-up OIDC=1), patching on (e2e/compose.patch.yml), CANYON_IMAGE_RUN moved to a newer digest of one
# repository; the canary patched to production by its approval, and two apps that exit in their watch reverted, the
# second pausing the identity. Before the move, a stale vulnerability database (design/PATCHING.md §3.5, #2081): every
# preview reads could not check, Settings › Patching shows the admin why (e2e/ui's patch project, in Chromium), and the
# rescans after it re-match with no image saved. What a change to the plan (Canyon Enterprise's, ee/patching, and the
# server's hook to it), the patch run, its watch and revert, the rebase, the rescan's scans, the run image or that page
# can break; journeys.yml calls it nightly on main, whatever the paths. Kubernetes' rebase is kpack's, which CI's kind does not run: e2e/cluster/CASES.md R1 is the test cluster's.
name: patch-e2e

on:
  pull_request:
    paths:
      - 'ee/patching/**'
      - 'cmd/canyon-server/ee_patching.go'
      - 'cmd/canyon-server/patching_hooks.go'
      - 'runs/patch*.go'
      - 'runs/watch*.go'
      - 'runs/waves*.go'
      - 'runs/prod*.go'
      - 'runs/brake*.go'
      - 'runs/plan*.go'
      - 'runs/rescan*.go'
      - 'runs/runimage*.go'
      - 'executor/rebase*.go'
      - 'executor/run.Dockerfile'
      - 'executor/scan*.go'
      - 'web/src/screens/Patching.tsx'
      - 'e2e/oidc/**'
      - 'e2e/ui/patch/**'
      - 'e2e/ui/playwright.config.ts'
      - 'e2e/compose.patch.yml'
      - '.github/workflows/patch-e2e.yml'
  workflow_call: # journeys.yml, stack.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # a stack suite: never on a fork's pull request, which runs the fast checks alone
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # canyon-arm-ondemand: our own arm64 VMs, on demand for a long job (AGENTS.md, Commands); a fork's pull request stays on GitHub's; every image the stack builds or pulls is multi-arch
    timeout-minutes: 75 # three deploys and a promotion, then three patch runs one at a time, each its gate, rebase, SBOM and a minute's watch
    permissions:
      contents: read
      actions: read # a scan-dbs job in the run, waited for on a day's first run (.github/actions/scan-dbs)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosted-dns # GitHub's hosted runners: their resolver also asks public DNS (its action.yml)
      - uses: ./.github/actions/go-cache # before setup-go: restoring the module cache over the toolchain setup-go just fetched collides (tar: File exists)
        with:
          job: e2e-ui
          build: 'false' # no main run saves this job's build cache
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # .github/actions/go-cache instead: main writes, a pull request reads
      - uses: actions/setup-node@v4 # e2e/ui's patch project, which the journey runs
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/ui/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e/ui
      - uses: ./.github/actions/scan-dbs # the stack's scanner databases, never downloaded live by the stack (#2496, #2510)
      - run: make e2e-up OIDC=1
      - name: the rebase patch and its revert (e2e/oidc/patch_test.go), every test listed run and passed, so a skip never passes
        run: |
          want=$(go test -tags oidc,patch -list '^TestRebasePatch' ./e2e/oidc/ | grep '^Test' | sort)
          rc=0
          go test -tags oidc,patch -count=1 -timeout 65m -json -run '^TestRebasePatch' ./e2e/oidc/ > "$RUNNER_TEMP/patch.json" || rc=$?
          jq -j 'select(.Output) | .Output' "$RUNNER_TEMP/patch.json"
          passed=$(jq -r 'select(.Action == "pass" and .Test) | .Test' "$RUNNER_TEMP/patch.json" | sort)
          if [ "$rc" != 0 ] || [ -z "$want" ] || [ "$want" != "$passed" ]; then
            printf 'go test exited %s\nlisted:\n%s\npassed:\n%s\n' "$rc" "$want" "$passed"; exit 1
          fi
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/scan-dbs
        with:
          check: 'true'
      - if: failure() || cancelled()
        run: | # the server's and executor's own lines, the requests left out: a deploy's CLI polls its timeline every second
          docker compose --env-file e2e/.work/fixtures/oidc.env -f docker-compose.yml -f e2e/compose.e2e.yml -f deploy/docker/team.yml -f e2e/compose.oidc.yml -f e2e/compose.patch.yml \
            logs --no-color server executor > "$RUNNER_TEMP/stack.log" 2>&1 || true
          grep -vE ' (GET|POST|PUT|DELETE) /' "$RUNNER_TEMP/stack.log" | tail -400
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-e2e-playwright
          path: e2e/ui/.work/results
          retention-days: 7
          if-no-files-found: ignore
