{{- /* What builds an app: deploy/k8s/builds.yaml. The kpack objects (ClusterStack, ClusterStore,
     ClusterBuilder, and kpack's own default ClusterLifecycle) are validated by kpack's webhook, which is
     not serving yet on a first install, so a hook Job applies them with server-side apply, retrying until
     it is. They update in place on upgrade and are left behind on uninstall (delete them by hand). */}}
{{- $b := .Values.canyon.builder }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canyon-builds
  namespace: canyon-builds
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    {{- include "canyon.dnsEgress" . | nindent 4 }}
    - to: [{ipBlock: {cidr: 0.0.0.0/0, except: {{ include "canyon.floor" . }}}}]
      ports: [{protocol: TCP, port: 80}, {protocol: TCP, port: 443}]
{{- if $b.registryCredential.dockerConfigJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: canyon-registry
  namespace: canyon-builds
  labels: {{- include "canyon.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ $b.registryCredential.dockerConfigJson | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canyon-builder-objects
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  objects.yaml: |
    {{- if .Values.kpack.enabled }}
    {{- .Files.Get "files/kpack-0.18.0-lifecycle.yaml" | nindent 4 }}
    ---
    {{- end }}
    apiVersion: kpack.io/v1alpha2
    kind: ClusterStack
    metadata: {name: canyon}
    spec:
      id: {{ $b.stack.id }}
      buildImage: {image: {{ include "canyon.image" (dict "root" . "name" "build") }}}
      runImage: {image: {{ include "canyon.image" (dict "root" . "name" "run") }}}
      serviceAccountRef: {name: canyon-build, namespace: canyon-builds}
    ---
    apiVersion: kpack.io/v1alpha2
    kind: ClusterStore
    metadata: {name: canyon}
    spec:
      sources:
        {{- range $b.buildpacks }}
        - {image: {{ .image }}}
        {{- end }}
    ---
    apiVersion: kpack.io/v1alpha2
    kind: ClusterBuilder
    metadata: {name: canyon}
    spec:
      tag: {{ $b.tag | default (printf "%s/canyon-builder" (include "canyon.registry" .)) }}
      stack: {name: canyon, kind: ClusterStack}
      store: {name: canyon, kind: ClusterStore}
      serviceAccountRef: {name: canyon-build, namespace: canyon-builds}
      order:
        {{- range $b.buildpacks }}
        - group: [{id: {{ .id }}}]
        {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canyon-builder-apply
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyon-builder-apply
  labels: {{- include "canyon.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [kpack.io]
    resources: [clusterstacks, clusterstores, clusterbuilders, clusterlifecycles]
    verbs: [get, list, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canyon-builder-apply
  labels: {{- include "canyon.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: canyon-builder-apply}
subjects: [{kind: ServiceAccount, name: canyon-builder-apply, namespace: canyon}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: canyon-builder-apply
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 8           # retries (10 s, 20 s, 40 s, …) until kpack's webhook answers
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: canyon-builder-apply
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: apply
          image: {{ include "canyon.image" (dict "root" . "name" "kubectl") }}
          args: [apply, --server-side, --force-conflicts, --field-manager=canyon-helm, -f, /objects/objects.yaml]
          env: [{name: HOME, value: /tmp}]  # kubectl's discovery cache
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: objects, mountPath: /objects}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: objects, configMap: {name: canyon-builder-objects}}, {name: tmp, emptyDir: {}}]
