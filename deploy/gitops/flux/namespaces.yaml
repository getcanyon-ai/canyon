# The two namespaces Flux's reference set-up adds beside flux-system (design/HAND-OFF.md §3b, §10). canyon-sync holds
# the deploy repo's sync: its GitRepositories, their read Secret, the sync accounts canyon-preview and canyon-prod and
# each app's Kustomization, so no Kustomization the generator makes can name a stronger account than those two
# (flux-system's controllers are cluster-admin). canyon-namespaces holds the generator's Helm release records. Neither
# name matches canyon-*-preview or canyon-*-prod, so neither is an app namespace to the store or the Services policy.
# No pod runs in either.
apiVersion: v1
kind: Namespace
metadata:
  name: canyon-sync
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: canyon-namespaces
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# At most this many app environments' Kustomizations: a flood of canyon.json paths on a branch fails the generator's
# upgrade, which removes what it made (cleanupOnFail), instead of loading kustomize-controller. Size it to your apps.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: canyon-sync
  namespace: canyon-sync
spec:
  hard:
    count/kustomizations.kustomize.toolkit.fluxcd.io: "500"
