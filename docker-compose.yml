# Append-only: one service per PR (AGENTS.md → Territory).
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # pinned by digest, a multi-arch index (#717); an edit to an existing service, called out against the append-only rule
    environment: # local defaults for the demo stack, not credentials: nothing outside canyon-internal can reach it
      - POSTGRES_USER=canyon
      - POSTGRES_PASSWORD=canyon
      - POSTGRES_DB=canyon
    volumes:
      - canyon-postgres:/var/lib/postgresql/data
    healthcheck: # the server connects and migrates once at boot; it must not start before Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U canyon -d canyon"] # over TCP: the image's init server listens on the socket alone, and stops before the real one starts
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [canyon-state] # the server's alone: the executor, which holds the Docker socket, has no route to it. An edit to an existing service, called out against the append-only rule
  server:
    build: .
    container_name: canyon-server # the executor joins it to each app's network by this name (CANYON_EXECUTOR_JOIN's default)
    environment:
      - CANYON_ADDR=:7777
      - CANYON_AUTH=demo # the demo's mode and nothing else's: the container binds its private network so the host mapping (127.0.0.1 only, below) can reach it, and every caller is an admin
      - CANYON_DATABASE_URL=postgres://canyon:canyon@postgres:5432/canyon?sslmode=disable
      - CANYON_EXECUTOR_URL=http://executor:7778
      - CANYON_PUBLIC_URL=http://localhost:7777 # apps are published as http://<app>.preview.localhost:7777
      # The address ports: below publishes the listener on, which the fleet's banner reads in place of the container's
      # own listener and peer: behind the mapping those say nothing about who reaches the host's port (#1892). Keep the
      # two equal; make demo-check proves it against docker port. An edit to an existing service, called out against
      # the append-only rule.
      - CANYON_PUBLISHED_ADDR=127.0.0.1:7777
      # The executor's pool of app networks (its CANYON_APPS_POOL below, which must match): the server is joined to each
      # app's network to proxy inward and its listener binds every interface, so a connection from any
      # address in it but a /24's gateway (where the host mapping arrives from) is closed at accept,
      # before any HTTP — under CANYON_AUTH=demo the API would otherwise hand an app container an admin
      # session. An edit to an existing service, called out against the append-only rule, as are
      # container_name, extra_hosts and the networks: `make demo-check` proves invariant 11 with them.
      - CANYON_APPS_SUBNET=10.213.0.0/16
      # The demo host writes the demo fleet roster into an empty database at first boot, so a fresh
      # `make demo` shows a fleet; a company's own host leaves this unset and starts empty. An edit to
      # an existing service, called out against the append-only rule: only this one boots the server.
      - CANYON_DEMO_SEED=1
      # How Canyon was installed, which the daily report says; team.yml sets its own. An edit to an existing service,
      # called out against the append-only rule.
      - CANYON_INSTALL_MODE=laptop
      # app-postgres below: a database and login per app and env when a deploy declares postgres; unset, none. An edit to an
      # existing service, called out against the append-only rule, as are depends_on and the pinned address pg_hba admits.
      - CANYON_APP_DATABASE_URL=postgres://canyon:canyon@app-postgres:5432/canyon?sslmode=disable
      # Envoy's access logs (design/EGRESS.md §2.4): the receiver on the server's address on canyon-egress-ctl, below,
      # which egress-envoy alone reaches, and the token it sends. A local default like Postgres's: set your own with
      # openssl rand -hex 32 (docs: self-host/configuration.md). An edit to an existing service, called out against
      # the append-only rule.
      - &egress-receiver-addr CANYON_EGRESS_RECEIVER_ADDR=10.214.3.2:7781 # one value, which the holder and Envoy alias below
      - &egress-receiver-token CANYON_EGRESS_RECEIVER_TOKEN=${CANYON_EGRESS_RECEIVER_TOKEN:-local-demo-default-set-your-own-receiver-token} # and Envoy
      # Envoy as an app routed via canyon reaches it, on its own network (design/EGRESS.md §4.4): what each such /run
      # names as HTTPS_PROXY. An edit to an existing service, called out against the append-only rule.
      - CANYON_EGRESS_PROXY=http://canyon-egress:3128
      # The setup chat's and the AI review's model is host configuration (design/EXPERIENCE.md D10);
      # this demo host names none, so GET /preferences answers setup_available: false and the AI
      # review shows as skipped. Naming any of these without a credential that resolves fails the
      # boot rather than half-offering either.
      # - CANYON_MODEL_PROVIDER=anthropic # the default; openai serves the AI review only; bedrock and vertex are refused at boot, naming their ticket
      # - CANYON_MODEL=claude-opus-5 # the id as that provider names it, for both; required on openai; Canyon maps none
      # - CANYON_MODEL_URL=http://gateway.internal:4000/anthropic # a gateway or proxy speaking the Anthropic Messages API; http or https, a host, no credential in it
      # - ANTHROPIC_API_KEY= # the key, for the Claude API or a gateway that wants one
      # - CANYON_MODEL_TOKEN= # a bearer token instead, when the gateway holds the provider key and this host holds none
      # - OPENAI_API_KEY= # the key on openai
    volumes:
      - canyon-keys:/var/lib/canyon/keys # the key file every secret is sealed under (CANYON_KEY_FILE); an edit to an existing service, called out against the append-only rule: the server cannot keep a secret across a restart without it
      - canyon-repos:/var/lib/canyon/repos # the package store (CANYON_REPOS); an edit to an existing service, called out against the append-only rule: without the directory every upload 500s, and without the volume every package is lost on recreate
    depends_on:
      postgres:
        condition: service_healthy
      app-postgres:
        condition: service_healthy
    ports: # 127.0.0.1 only: published on every address, Docker's proxy would hand an app the API from its own /24's gateway, which the guard serves (appnet.go; make demo-check probes it)
      # Under CANYON_AUTH=demo keep this on 127.0.0.1, and CANYON_PUBLISHED_ADDR equal to it; a Canyon other
      # people reach runs oidc (deploy/docker/team.yml, #2449). An edit called out against the append-only rule.
      - "127.0.0.1:7777:7777"
    extra_hosts: # the provisioning login's route, ahead of DNS: app-postgres is on every app network too, where pg_hba refuses the admin login
      - "app-postgres:10.214.0.3"
    networks: # it alone reaches Canyon's Postgres; the executor adds each app's network, to proxy inward
      canyon-state: {}
      canyon-internal: {}
      canyon-provisioning:
        ipv4_address: 10.214.0.2 # the one address pg_hba admits the admin login from
      canyon-egress-ctl: # where Envoy's access logs reach its receiver, the one address egress's floor admits (design/EGRESS.md §2.2); an edit to an existing service, called out against the append-only rule
        ipv4_address: 10.214.3.2
        gw_priority: -1 # never the server's default route, nor where its published port arrives from
  # The demo's sample apps (#1490): a one-shot that deploys four stand-ins through Canyon, so the fleet
  # shows real running apps; the first boot builds them, a few minutes. Only under its profile (make demo):
  # a plain `docker compose up`, the E2E stack and CI never build or start it.
  demo-apps:
    profiles: ["demo-apps"]
    build:
      context: .
      target: demo-apps
    depends_on:
      server:
        condition: service_started
    restart: "no"
    # on when canyon demo up --with-trivy asked for Trivy, which the deployer otherwise leaves off (cli.md §6.14; #237). An
    # edit to an existing service, called out against the append-only rule.
    environment:
      - CANYON_DEMO_TRIVY=${CANYON_DEMO_TRIVY:-}
    # In the server's own network namespace, so it reaches the server at localhost:7777: with sign-in off the server
    # answers a loopback name alone (421 to any other Host, against DNS rebinding), and no Host a browser can be made to
    # send by name is allowed in for it. An edit to an existing service, called out against the append-only rule.
    network_mode: service:server

  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
      args:
        PACK_VERSION: "0.40.3"
        PACK_SHA256_AMD64: 2f18dd0e63a181af411e648ed7467f4f081dc458ffacbd11644d5b911fc063ce
        PACK_SHA256_ARM64: d84fbb295e2b11775616c22c2f3ada562141fe3c437298775e7b8892ff43c846
    environment:
      - CANYON_EXECUTOR_ADDR=:7778
      # The /24s app networks are cut from: must match the server's CANYON_APPS_SUBNET, or an app on a /24 the
      # server's guard does not cover reaches its API (make demo-check probes from two apps' /24s). An edit to an
      # existing service, called out against the append-only rule.
      - CANYON_APPS_POOL=10.213.0.0/16
      # Each build runs behind a floor in its own holder (contracts/executor.md, A build reaches no private or
      # link-local address): the holder's image, as egress's below, and the private addresses builds may reach
      # besides, such as an internal registry, each <IPv4 prefix>:<TCP port>. An edit to an existing service,
      # called out against the append-only rule.
      - CANYON_IMAGE_EGRESS_HOLDER=${CANYON_IMAGE_EGRESS_HOLDER:-}
      - CANYON_BUILD_ALLOW=${CANYON_BUILD_ALLOW:-}
      - CANYON_EGRESS_POOLS=10.213.0.0/16,10.214.0.0/16 # Canyon's networks, as egress's below: a build's floor refuses them before CANYON_BUILD_ALLOW
      # Each app on an open network runs behind a floor in its own holder (contracts/executor.md, An app reaches no
      # private, link-local or host address): the private addresses apps may reach besides their own network, each
      # <IPv4 prefix>:<TCP port>. Under demo, a range that holds the host's address (Colima's 192.168.5.0/24, Docker
      # Desktop's 192.168.65.0/24) hands an app the dashboard as an admin (#2503). An edit to an existing service,
      # called out against the append-only rule.
      - CANYON_APPS_ALLOW=${CANYON_APPS_ALLOW:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [canyon-internal]
  app-postgres: # the apps' databases: the executor joins it to each app's network, where an app logs in as its own login; the control plane's postgres stays out of their reach
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # as postgres's (#717); an edit to an existing service, called out against the append-only rule
    container_name: app-postgres # the name the executor joins (CANYON_EXECUTOR_JOIN's default) and apps' DATABASE_URL names
    environment: # a local default like postgres's; pg_hba below admits it from the server's address alone
      - POSTGRES_USER=canyon
      - POSTGRES_PASSWORD=canyon
    command: ["postgres", "-c", "hba_file=/etc/canyon/pg_hba.conf"]
    configs:
      - source: app-postgres-hba
        target: /etc/canyon/pg_hba.conf
    volumes:
      - canyon-app-postgres:/var/lib/postgresql/data
    healthcheck: # as postgres's, but as a role pg_hba does not reject: `-U canyon` over TCP logged a FATAL every 2 s (#2019); pg_isready sends no password, and a client that leaves at the password prompt is not logged
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      canyon-provisioning:
        ipv4_address: 10.214.0.3
  # Egress's namespace holder (design/EGRESS.md §2.2): it applies the floor (deploy/egress/floor.sh) in its own network
  # namespace and sleeps, listening on nothing; Envoy joins that namespace (network_mode: service:egress) without
  # NET_ADMIN. The executor joins it to every internal app network (CANYON_EXECUTOR_EGRESS_JOIN's default), never an
  # open one: an app routed via canyon reaches nothing else outside its own (contracts/executor.md, Egress).
  egress:
    # Kubernetes' own stock iptables image, a shell and sleep beside it; CANYON_IMAGE_EGRESS_HOLDER names a mirror's.
    image: ${CANYON_IMAGE_EGRESS_HOLDER:-registry.k8s.io/build-image/distroless-iptables:v0.11.0@sha256:bedc7f0c0dc8e42a316f1cd6d6ee321eb4159e1f75ac30875bdfcf13446bc7a0}
    container_name: canyon-egress # the name contracts/executor.md gives it, which the executor joins to each internal app network
    entrypoint: ["/bin/sh", "/etc/canyon/floor.sh"]
    environment:
      - *egress-receiver-addr # the server's address on canyon-egress-ctl, above, and the receiver's port
      # The upstream resolvers Envoy will resolve through, never Docker's 127.0.0.11, which would answer canyon-server:
      # this machine's own; by default Google's public ones (docs: self-host/configuration.md).
      - &egress-resolvers CANYON_EGRESS_RESOLVERS=${CANYON_EGRESS_RESOLVERS:-8.8.8.8,8.8.4.4} # and Envoy
      - CANYON_EGRESS_POOLS=10.213.0.0/16,10.214.0.0/16 # the apps' pool, as the server's CANYON_APPS_SUBNET and the executor's CANYON_APPS_POOL name it, and every network below
      # The connections one source address, an app's container, may hold to Envoy's :3128; the next is reset (design/EGRESS.md
      # §2.1). Envoy holds 16,384 in all and an app's process 1,024 files at most (the executor's nofile): 512 is half of
      # one process's and a 32nd of Envoy's, so no one app holds the rest out. An edit to this service, called out against
      # the append-only rule (docs: self-host/configuration.md).
      - CANYON_EGRESS_PER_SOURCE=${CANYON_EGRESS_PER_SOURCE:-512}
      # The Docker host's own addresses, which the floor refuses before public 80 and 443 (#2524): egress-host's listing,
      # below. An edit to this service, called out against the append-only rule, as are depends_on and volumes.
      - CANYON_EGRESS_HOST_FILE=/run/canyon-host/addrs
    depends_on:
      egress-host:
        condition: service_healthy # the listing is there: the floor never starts without it
    volumes:
      - canyon-egress-host:/run/canyon-host:ro
    configs:
      - source: egress-floor
        target: /etc/canyon/floor.sh
    cap_drop: [ALL]
    cap_add: [NET_ADMIN] # its own namespace's rules, nothing else; Envoy will have none
    security_opt: [no-new-privileges:true]
    read_only: true
    init: true # sleep as PID 1 would ignore the SIGTERM of a stop
    sysctls: # nothing forwarded, and no IPv6 in the namespace, ::1 included: the floor's rules are IPv4's. A host booted with ipv6.disable=1 has no such sysctl and cannot start it
      net.ipv4.ip_forward: 0
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    healthcheck: # the jump into the floor's chain is floor.sh's last rule: healthy once the whole floor is in place
      test: ["CMD", "iptables-nft", "-C", "OUTPUT", "-j", "CANYON-FLOOR"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      canyon-egress-ctl:
        ipv4_address: 10.214.3.3 # pinned beside the server's: started first, it would take .2 from docker's allocator
  # Egress's Envoy (design/EGRESS.md §2.1): a forward proxy on :3128 in the holder's network namespace, once its floor
  # is in place; its one log goes to the server's receiver, its admin is a Unix socket. An app routed via canyon calls
  # out through it (contracts/executor.md, Egress).
  egress-envoy:
    # The stock image, pinned by digest: v1.39.3, a security release (design/EGRESS.md §7); CANYON_IMAGE_EGRESS names a mirror's.
    image: ${CANYON_IMAGE_EGRESS:-docker.io/envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865}
    container_name: canyon-egress-envoy
    network_mode: service:egress
    depends_on:
      egress:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/canyon/envoy.sh"]
    environment:
      # The server's receiver and token and the holder's resolvers, aliased, so no value here can drift from theirs.
      - *egress-receiver-addr
      - *egress-receiver-token
      - *egress-resolvers
    configs:
      - source: egress-envoy
        target: /etc/canyon/envoy.sh
      - source: egress-envoy-bootstrap
        target: /etc/canyon/envoy.yaml
    user: "65534:65534" # nobody: Envoy binds 3128 and its socket, nothing that needs root
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /var/run/envoy:uid=65534,gid=65534,mode=0700 # the filled-in bootstrap, which holds the token
    volumes: # an edit to this service, called out against the append-only rule: egress-control reads what Envoy lost (#2374)
      - canyon-egress-admin:/var/run/envoy-admin # the admin socket, a Unix socket and never a port
    labels: # an edit to this service, called out against the append-only rule: compose's config hash reads a config's name, not its contents, so a bootstrap-only upgrade would leave Envoy on the old file (#2125)
      canyon.egress-config-sha256: 32724320652b41fc558709b85197a815dd5e9a1b4dc5baa07bccc8d0f98d5ab5 # envoy.sh and envoy.yaml, as the Kubernetes annotation sums them
  # Egress's check (design/EGRESS.md §3.1): canyon-server egress-control, the server's image as a subcommand, in the
  # holder's network namespace beside Envoy, which asks it on loopback before every call and answers 503 while it
  # does not answer. It pulls the policy from the server on canyon-egress-ctl, where its address is who it is
  # (§3.2), keeps nothing across a start, and is healthy once it holds a policy.
  egress-control:
    build: .
    container_name: canyon-egress-control
    network_mode: service:egress
    depends_on:
      egress:
        condition: service_healthy
    command: ["egress-control"]
    environment:
      - CANYON_EGRESS_POLICY_URL=http://10.214.3.2:7782/egress/policy # the server's receiver's address, port 7782, where it serves the policy and the floor admits it, both by default
      - CANYON_EGRESS_REPLICAS=1 # the one replica: the most that answer at once, so it lets an app env 30 new names a minute
      # The receiver's token, which egress-control serves Envoy in its interception listener's access log, over loopback
      # alone; without it no call is intercepted (#2740). An edit to this service, called out against the append-only rule.
      - *egress-receiver-token
    volumes: # an edit to this service, called out against the append-only rule: what Envoy lost reaches the server through here (#2374)
      - canyon-egress-admin:/var/run/envoy-admin:ro # Envoy's admin socket: whoever reaches it reads the bootstrap, token and all, and POSTs admin calls, and only these two reach it
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    healthcheck: # its readiness: it holds a policy, which only the server's 200 gives it
      test: ["CMD", "/canyon-server", "egress-control", "probe"]
      interval: 2s
      timeout: 2s
      retries: 30
  # The Docker host's own addresses for egress's floor (#2524; contracts/executor.md, An app reaches no private,
  # link-local or host address): `ip addr show` in the host's network namespace, as the executor reads them for an
  # app's floor, written once into a volume the holder reads at its start, then sleep. On Docker Desktop and Colima the
  # host is the VM. No capability, a read-only root, and nothing of the host's but its addresses read.
  egress-host:
    image: ${CANYON_IMAGE_BUSYBOX:-docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e} # the port check's busybox, the executor's pin
    container_name: canyon-egress-host
    network_mode: host
    entrypoint: ["/bin/sh", "-c", "rm -f /run/canyon-host/addrs && { echo boot_id $$(cat /proc/sys/kernel/random/boot_id) && ip addr show && echo end; } > /run/canyon-host/addrs.new && mv /run/canyon-host/addrs.new /run/canyon-host/addrs && exec sleep 2147483647"]
    volumes:
      - canyon-egress-host:/run/canyon-host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    init: true # sleep as PID 1 would ignore the SIGTERM of a stop
    healthcheck: # the listing is written, whole: the holder starts on it alone
      test: ["CMD", "test", "-s", "/run/canyon-host/addrs"]
      interval: 2s
      timeout: 2s
      retries: 15

configs:
  app-postgres-hba:
    content: |
      local all all trust
      host all canyon 10.214.0.2/32 scram-sha-256
      host all canyon all reject
      host all all all scram-sha-256
  egress-floor:
    file: ./deploy/egress/floor.sh
  egress-envoy:
    file: ./deploy/egress/envoy.sh
  egress-envoy-bootstrap:
    file: ./deploy/egress/envoy.yaml

# Each app's containers live on canyon-app-<app>, which the executor creates, shares with the server
# and app-postgres alone, and removes (contracts/executor.md, invariant 11). Names are fixed: the
# contract names them, not <project>_<name>.
# Every subnet here and CANYON_APPS_POOL sit in 10.213-10.214, outside Docker's default pools (172.17-172.31 and
# 192.168): pinned inside them, `up` failed with "Pool overlaps" on a laptop whose other projects had taken the 12th
# and 13th /16 (#2019). An edit to existing services, called out against the append-only rule.
networks: # every subnet pinned outside CANYON_APPS_POOL, so Docker's allocator never hands one of these a /24 an app network needs
  canyon-state: # Canyon's Postgres and the server, nothing else
    name: canyon-state
    ipam:
      config:
        - subnet: 10.214.1.0/24
  canyon-internal:
    name: canyon-internal
    ipam:
      config:
        - subnet: 10.214.2.0/24
  canyon-provisioning: # the server's admin login to app-postgres, outside the executor's pool: no app network carries it
    name: canyon-provisioning
    ipam: # pinned so pg_hba and extra_hosts can name the two addresses
      config:
        - subnet: 10.214.0.0/29
  canyon-egress-ctl: # egress's namespace and the server's receiver, nothing else: never canyon-internal, where the executor holds the Docker socket (design/EGRESS.md §2.2)
    name: canyon-egress-ctl
    ipam: # pinned so the server's receiver has its one address
      config:
        - subnet: 10.214.3.0/24

volumes:
  canyon-postgres: # the ledger and every project's runs survive a restart
  canyon-keys: # the vault's key file; `down -v` destroys key and data together, `down` keeps both
  canyon-repos: # every project's git store; the same `down -v` rule
  canyon-app-postgres: # the apps' databases; the same `down -v` rule
  canyon-egress-host: # egress-host's listing of the host's addresses, written at each of its starts; named, so e2e's scratch holders read it too
    name: canyon-egress-host
  canyon-egress-admin: # Envoy's admin socket and nothing else, in memory, for the two containers that mount it; named, so e2e reads who mounts it
    name: canyon-egress-admin
    driver_opts: {type: tmpfs, device: tmpfs, o: "uid=65534,gid=65534,mode=0700,size=1m"}
