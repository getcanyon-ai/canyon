# Canyon's Envoy: a static forward proxy on :3128 in canyon-egress's network
# namespace, whose floor (floor.sh) refuses every private destination. Every call is first checked by
# egress-control, beside it on loopback, before anything is resolved or sent upstream. Its one log is ALS to the
# server's receiver; its admin is a Unix socket. envoy.sh fills the @…@ values from the environment and starts
# Envoy on what it wrote; CI validates that, as it runs. Layer 3 (design/EGRESS.md §4.2): a CONNECT the check marks
# for interception goes to the one internal listener, which egress-control serves by LDS, its leaves by SDS, over
# ADS on the check's own loopback address; every other call passes through as before, never decrypted.
node: {id: canyon-egress, cluster: canyon-egress} # egress-control serves the one Envoy beside it, whatever node it names

bootstrap_extensions: # the internal listener the one internal cluster reaches
- name: envoy.bootstrap.internal_listener
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener

dynamic_resources: # listeners alone, and their secrets, from egress-control: no clusters, routes or endpoints come by xDS
  lds_config: {ads: {}, resource_api_version: V3, initial_fetch_timeout: 5s} # egress-control answers at once, with no listener until a policy; past 5 s :3128 starts all the same, every call checked
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    set_node_on_first_message_only: true
    grpc_services: [{envoy_grpc: {cluster_name: control}}]

admin: # never a TCP port, and no admin access log
  address:
    pipe:
      path: /var/run/envoy-admin/admin.sock
      mode: 384 # 0600

overload_manager: # Envoy's edge best practice: shed load before the heap runs out, and cap the connections it holds
  refresh_interval: 0.25s
  resource_monitors:
  - name: envoy.resource_monitors.fixed_heap
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.fixed_heap.v3.FixedHeapConfig
      max_heap_size_bytes: 1073741824 # 1 GiB
  - name: envoy.resource_monitors.global_downstream_max_connections
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
      max_active_downstream_connections: 16384
  actions:
  - name: envoy.overload_actions.shrink_heap
    triggers: [{name: envoy.resource_monitors.fixed_heap, threshold: {value: 0.95}}]
  - name: envoy.overload_actions.stop_accepting_requests
    triggers: [{name: envoy.resource_monitors.fixed_heap, threshold: {value: 0.98}}]
  - name: envoy.overload_actions.reduce_timeouts # from half of the connections, reaching it at 90%, idle connections are shed sooner
    triggers: [{name: envoy.resource_monitors.global_downstream_max_connections, scaled: {scaling_threshold: 0.5, saturation_threshold: 0.9}}]
    typed_config:
      "@type": type.googleapis.com/envoy.config.overload.v3.ScaleTimersOverloadActionConfig
      timer_scale_factors: # never a stream's: a byte every few seconds beats it, and it would cut every app's silent call while one floods
      - {timer: HTTP_DOWNSTREAM_CONNECTION_IDLE, min_timeout: 5s}

static_resources:
  listeners:
  - name: egress
    address: {socket_address: {address: 0.0.0.0, port_value: 3128}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          codec_type: HTTP1 # proxy clients speak HTTP/1.1; h2c would carry streams without end on one connection
          upgrade_configs: [{upgrade_type: CONNECT}] # CONNECT over HTTP/1.0 is 426: accept_http_10 stays false
          skip_xff_append: true
          generate_request_id: false
          common_http_protocol_options:
            idle_timeout: 60s # a connection with no request open, one that never sends a byte among them, is closed
            max_stream_duration: 900s # a call has 15 minutes, as a tunnel does, a request whose body trickles in among them
          request_headers_timeout: 10s # a client that never finishes its headers is closed
          stream_idle_timeout: 300s # a request or a tunnel that moves no byte for 5 minutes is closed
          access_log_options: # a long tunnel is attributed while its caller lives, and is its row from the moment it opens, not at its end
            access_log_flush_interval: 60s
            flush_log_on_tunnel_successfully_established: true
          access_log:
          - name: envoy.access_loggers.http_grpc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.grpc.v3.HttpGrpcAccessLogConfig
              common_config:
                log_name: egress
                transport_api_version: V3
                custom_tags: [{tag: canyon.tunnel_open_entry, literal: {value: "1"}}] # says so on every entry: this Envoy's tunnels were counted as they opened, so the receiver counts no last entry of one
                grpc_service:
                  envoy_grpc: {cluster_name: receiver}
                  initial_metadata: [{key: authorization, value: "Bearer @receiver_token@"}] # the token the server's receiver checks
          local_reply_config: # the check did not answer in time, or at all: Canyon's line, never Envoy's
            mappers:
            - filter:
                and_filter:
                  filters:
                  - status_code_filter: {comparison: {op: EQ, value: {default_value: 503}}}
                  - response_flag_filter: {flags: [UAEX]}
              body: {inline_string: "Canyon's egress check did not answer, so this call was not made."}
            # An absolute-form call to a destination with a route — one whose check's OK named it — that fails before it
            # is sent: upstream_failed, never on a CONNECT, whose failure to find the internal listener stays 503. A
            # metadata_filter matches a call without the key unless match_if_key_not_found is false: every other call's
            # failure would read upstream_failed.
            - filter:
                and_filter:
                  filters:
                  - response_flag_filter: {flags: [UF, DF]}
                  - metadata_filter: {matcher: {filter: envoy.filters.http.ext_authz, path: [{key: destination}], value: {present_match: true}}, match_if_key_not_found: false}
                  - header_filter: {header: {name: ":method", string_match: {exact: CONNECT}, invert_match: true}}
              status_code: 502
              body_format_override:
                text_format_source: {inline_string: "Canyon could not connect to %DYNAMIC_METADATA(envoy.filters.http.ext_authz:destination)% or verify its certificate, so it did not send this call."}
              headers_to_add:
              - {header: {key: Canyon-Egress, value: upstream_failed}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
              - {header: {key: content-type, value: "text/plain; charset=utf-8"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
          http_filters:
          # First, before any check: a request that already carries x-canyon-intercept, the header that sends a
          # CONNECT to the internal listener, is refused, so no app routes itself there (contracts/routes.md,
          # Interception). Its 403 is Envoy's own.
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              rules:
                action: DENY
                policies:
                  forged-intercept:
                    permissions: [{header: {name: x-canyon-intercept, present_match: true}}]
                    principals: [{any: true}]
          # The check, before anything is resolved or sent upstream. It reads the
          # connection's own peer, which no listener filter rewrites (none here takes PROXY protocol), and the
          # method, scheme and authority, fields of their own; allowed_headers sends it no app header but Proxy-Authorization.
          # Its answer's metadata, in the namespace envoy.filters.http.ext_authz, which no other filter here writes,
          # reaches the receiver on the call's access-log entry, an OK's and a refusal's alike. An OK that sets or
          # removes x-canyon-intercept routes the request again (clear_route_cache).
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              transport_api_version: V3
              grpc_service:
                envoy_grpc: {cluster_name: control}
                timeout: 5s # room for the refetch a new pod's first call waits on (4 s), never for a known caller's
              failure_mode_allow: false # no answer is a 503, never a call let through
              status_on_error: {code: ServiceUnavailable}
              allowed_headers: {patterns: [{exact: ":method"}, {exact: "proxy-authorization"}]} # the method, the check's own field, and a pod's token on Kubernetes, which the check's OK removes (design/EGRESS.md §4.3)
              clear_route_cache: true
          # What the check's intercept OK names, the caller and the destination it approved, carried into the tunnel as
          # filter state, once (shared_with_upstream ONCE): the internal listener's header_mutation reads them, an
          # object missing an empty header there, which ext_authz #2 refuses. An absolute-form inject OK names its
          # destination too, so canyon.destination is set for it, and read by nothing: it goes to tls, no internal
          # listener. Nothing is set for any other call.
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              on_request_headers:
              - object_key: canyon.caller
                factory_key: envoy.string
                format_string: {text_format_source: {inline_string: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:caller)%"}, omit_empty_values: true}
                shared_with_upstream: ONCE
                skip_if_empty: true
              - object_key: canyon.destination
                factory_key: envoy.string
                format_string: {text_format_source: {inline_string: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:destination)%"}, omit_empty_values: true}
                shared_with_upstream: ONCE
                skip_if_empty: true
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: &dns
                name: egress
                dns_lookup_family: V4_ONLY
                max_hosts: 16384
                dns_cache_circuit_breaker: {max_pending_requests: 16384} # as many resolutions waiting as Envoy holds connections, not 1,024
                typed_dns_resolver_config: &resolver # the machine's upstream resolvers, never Docker's 127.0.0.11, which would answer canyon-server
                  name: envoy.network.dns_resolver.cares
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
                    resolvers: "@resolvers@"
                    dns_resolver_options: {no_default_search_domain: true} # a name is looked up as given, never under the resolv.conf's search domains (on Kubernetes, the cluster's own)
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              suppress_envoy_headers: true
          route_config:
            name: egress
            request_headers_to_remove: [x-request-id, x-forwarded-proto] # suppress_envoy_headers leaves both
            virtual_hosts:
            - name: egress
              domains: ["*"]
              # Every route names its port: 443 for CONNECT and https, 80 for http, and no other, so no one can ask
              # Envoy for the server's receiver, the one port of Canyon's networks the floor admits. Any other
              # request matches no route: 404.
              routes:
              - match: # CONNECT the check marked for interception: to the one internal listener, never the plain tunnel
                  connect_matcher: {}
                  headers:
                  - {name: ":authority", string_match: {safe_regex: {regex: "[^:]+:443"}}}
                  - {name: x-canyon-intercept, string_match: {exact: "1"}}
                route:
                  cluster: intercept
                  upgrade_configs: [{upgrade_type: CONNECT, connect_config: {}}]
                  timeout: 0s # a tunnel ends when either side closes it, or at 15 minutes
                  max_stream_duration: {max_stream_duration: 900s}
              - match: # CONNECT, terminated: the tunnel's bytes are spliced to the authority, never read
                  connect_matcher: {}
                  headers: [{name: ":authority", string_match: {safe_regex: {regex: "[^:]+:443"}}}]
                route:
                  cluster: plain
                  upgrade_configs: [{upgrade_type: CONNECT, connect_config: {}}]
                  timeout: 0s # a tunnel ends when either side closes it, or at 15 minutes
                  max_stream_duration: {max_stream_duration: 900s}
              - match: # absolute-form https:// (axios ≤ 1.7 sends it instead of CONNECT): Envoy originates the TLS
                  prefix: /
                  headers:
                  - {name: ":scheme", string_match: {exact: https}}
                  - {name: ":authority", string_match: {safe_regex: {regex: "[^:]+(:443)?"}}}
                route: {cluster: tls, timeout: 900s} # a slow call, a model API's, has a tunnel's 15 minutes, not Envoy's default 15 s
              - match: # absolute-form http://: the check refuses it to a destination with a route itself (inject_requires_tls), whatever this regex admits
                  prefix: /
                  headers:
                  - {name: ":scheme", string_match: {exact: http}}
                  - {name: ":authority", string_match: {safe_regex: {regex: "[^:]+(:80)?"}}}
                route: {cluster: plain, timeout: 900s}

  clusters:
  - name: plain
    lb_policy: CLUSTER_PROVIDED
    circuit_breakers: &breakers # as many as Envoy holds downstream, never the default 1,024, which a few apps' tunnels would fill for all
      thresholds: [{max_connections: 16384, max_pending_requests: 16384, max_requests: 16384}]
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *dns
  - name: tls
    lb_policy: CLUSTER_PROVIDED
    circuit_breakers: *breakers
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *dns
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        upstream_http_protocol_options: {auto_sni: true, auto_san_validation: true}
        auto_config: {http2_protocol_options: {}, http_protocol_options: {}}
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        max_session_keys: 0 # a session for one destination is never resumed for another on a shared CDN address
        common_tls_context:
          alpn_protocols: [h2, http/1.1]
          validation_context: {trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}} # the image's own
  - name: intercept # the one internal cluster: to the internal listener egress-control serves, the tunnel's filter state with it
    type: STATIC
    circuit_breakers: *breakers
    load_assignment:
      cluster_name: intercept
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {envoy_internal_address: {server_listener_name: intercept}}}
    transport_socket:
      name: envoy.transport_sockets.internal_upstream
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.internal_upstream.v3.InternalUpstreamTransport
        transport_socket:
          name: envoy.transport_sockets.raw_buffer
          typed_config: {"@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer}
  - name: intercepted # an inner request's way out: TLS Envoy originates and verifies, never resuming a session; one sub-cluster a destination, resolved as :3128's are
    lb_policy: CLUSTER_PROVIDED
    circuit_breakers: *breakers
    dns_lookup_family: V4_ONLY
    typed_dns_resolver_config: *resolver
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        sub_clusters_config: {max_sub_clusters: 16384}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        upstream_http_protocol_options: {auto_sni: true, auto_san_validation: true}
        auto_config: {http2_protocol_options: {}, http_protocol_options: {}}
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        max_session_keys: 0
        common_tls_context:
          alpn_protocols: [h2, http/1.1]
          validation_context: {trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}} # the image's own
  - name: control # egress-control, beside Envoy on loopback, over gRPC: the check, and the interception listener by ADS
    type: STATIC
    circuit_breakers: *breakers # every call waits on one check: as many as Envoy holds, so none overflows to a 503
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: control
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: "@control_address@", port_value: "@control_port@"}}}
  - name: receiver # the server's on canyon-egress-ctl, over gRPC
    type: STATIC
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http2_protocol_options: {}}
    load_assignment:
      cluster_name: receiver
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: "@receiver_address@", port_value: "@receiver_port@"}}}
