{{- /* What k3s needs beyond the base (README, "Differences"). Egress only, never ingress.
     - The executor reaches the API server, which kubernetes.default answers on the node at 6443.
     - The executor and builds reach the in-cluster registry.
     - The server and the apps' oauth2-proxy sidecars reach the gateway on 443: the
       bundled hosts resolve to the node itself, kube-proxy turns that into the gateway pod's address
       before policies match, and the base's public-443 rules leave pod addresses out. Through the
       gateway a pod reaches only what the internet can. An app whose calls go through Canyon's egress gateway
       (its pod labelled canyon.floor) is left out: policies add up, and its way out is that gateway alone. */}}
{{- if .Values.platform.k3s.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canyon-executor-k3s
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: canyon-executor}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: {{ required "platform.k3s.apiServer is required" .Values.platform.k3s.apiServer }}/32}}]
      ports: [{protocol: TCP, port: 6443}]
    {{- if .Values.infra.registry.enabled }}
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: canyon-infra}}, podSelector: {matchLabels: {app: registry}}}]
      ports: [{protocol: TCP, port: 5000}]
    {{- end }}
{{- if .Values.infra.registry.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canyon-builds-k3s
  namespace: canyon-builds
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: canyon-infra}}, podSelector: {matchLabels: {app: registry}}}]
      ports: [{protocol: TCP, port: 5000}]
{{- end }}
{{- if .Values.gateway.enabled }}
{{- range $p := list (dict "name" "canyon-server-gateway" "ns" "canyon" "sel" (dict "app.kubernetes.io/name" "canyon-server"))
                    (dict "name" "canyon-apps-gateway" "ns" "canyon-apps" "floor" true) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $p.name }}
  namespace: {{ $p.ns }}
  labels: {{- include "canyon.labels" $ | nindent 4 }}
spec:
  podSelector: {{ if $p.floor }}{matchExpressions: [{key: canyon.floor, operator: DoesNotExist}]}{{ else }}{matchLabels: {{ toJson $p.sel }}}{{ end }}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: canyon-gateway}}, podSelector: {matchLabels: {app: caddy}}}]
      ports: [{protocol: TCP, port: 443}]
{{- end }}
{{- end }}
{{- end }}
