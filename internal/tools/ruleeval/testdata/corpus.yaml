# The custom rules ruleeval translates (#2637, Phase 0), each with the checker it should get and, for a
# rule code can decide, its verdict on every fixture app under apps/: pass, fail, or unchecked where a
# fact it needs is missing (the dependencies of every app whose packages Canyon cannot all read, and
# py-reqs' secrets). An adversarial rule passes the bar as ai, or as code whose verdicts are the ones
# listed. These expectations are what the rules mean; they are never edited to make a model's answers
# score.

# The secrets each app has set, by name only. py-reqs has none given: that fact is missing for it.
apps:
  node-shop:
    secrets:
      - {name: SESSION_SECRET, env: preview, where: runtime}
      - {name: SESSION_SECRET, env: prod, where: runtime}
      - {name: STRIPE_SECRET_KEY, env: preview, where: runtime}
      - {name: STRIPE_SECRET_KEY, env: prod, where: runtime}
  node-legacy:
    secrets:
      - {name: db_password, env: preview, where: runtime}
      - {name: AWS_SECRET_ACCESS_KEY, env: preview, where: runtime}
      - {name: NPM_TOKEN, env: preview, where: build}
  go-api:
    secrets:
      - {name: CANYON_TOKEN, env: preview, where: runtime}
  go-legacy:
    secrets:
      - {name: DB_PASSWORD, env: prod, where: runtime}
  py-uv:
    secrets:
      - {name: OPENAI_API_KEY, env: preview, where: runtime}
      - {name: OPENAI_API_KEY, env: prod, where: runtime}
  py-reqs: {}
  ts-next:
    secrets:
      - {name: NEXT_PUBLIC_API_URL, env: preview, where: build}
      - {name: BUILD_NPM_TOKEN, env: preview, where: build}
  static-site:
    secrets: []
  php-app:
    secrets: []
  py-setup:
    secrets: []
  py-reqdir:
    secrets: []
  py-pipfile:
    secrets: []
  deno-app:
    secrets: []
  elixir-app:
    secrets: []
  go-old:
    secrets: []
  go-replace:
    secrets: []
  npm-alias:
    secrets: []

