name: Release

# A pushed tag v* publishes one release of the tagged commit (RELEASING.md): the CLI for every platform (make
# cli-release) as the tag's GitHub release, and Canyon's nine images on GHCR (make images-release), each for
# linux/amd64 and linux/arm64, with images.txt on the release naming each one by digest (the Kubernetes install
# guide, docs/src/content/docs/self-host/kubernetes.md). The release stays a draft until images.txt is on it and
# every image in it pulls by digest on amd64 and on arm64. Then the same release, with the chart, the deploy bundle
# and Opengrep's source packed beside it, goes to getcanyon-ai/canyon-releases, which install.sh reads
# (scripts/publish-release.sh), and release-smoke
# installs what was published. Images build on tags alone, never on a pull request, and every job runs on GitHub's
# runners. release, images and canyon-releases each refuse a commit that isn't on main.
#
# Credentials (RELEASING.md, The tokens): the images push with each job's own GITHUB_TOKEN (packages: write), which
# needs this repository to have write access on each of the nine packages. Only canyon-releases holds a secret,
# CANYON_RELEASES_TOKEN (fine-grained: Contents read and write on getcanyon-ai/canyon-releases alone), in the release
# environment, which only a v* tag may use; that job checks nothing out and runs none of the tree's code. The packing
# that runs the tree's scripts is canyon-releases-pack, with no secret.
#
# Run by hand (workflow_dispatch), it is a rehearsal that publishes nothing: the CLI, all nine images for both
# architectures (built to their digests, pushed nowhere), and the chart, the bundle and Opengrep's source packed and
# checked as for a release, under the version v0.0.0-rehearsal.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && 'v0.0.0-rehearsal' || github.ref_name }}
  REHEARSAL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  release:
    runs-on: ubuntu-24.04-arm # arm64 minutes cost 5/8 of x64's; the CLI is pure Go and cross-compiles to every platform
    timeout-minutes: 15
    permissions:
      contents: write # gh release create
    steps:
      - name: the commit is on main, so only reviewed code is released
        env:
          GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: | # a blobless fetch of main into a scratch repository: the job's own checkout is never trusted for this
          set -euo pipefail
          git init -q --bare "$RUNNER_TEMP/onmain"
          git -C "$RUNNER_TEMP/onmain" fetch -q --filter=blob:none "$GH_REPO_URL" main
          git -C "$RUNNER_TEMP/onmain" merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_SHA is not on main: a release is cut from main alone"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # the build never needs the write token on disk; gh reads GH_TOKEN
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # one build per release; not worth a cache entry against the repo's 10 GB limit
      - name: the tag is a version (v1.2.3, v1.2.3-rc.1) — it names the files and is stamped into the binary
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }'
      - name: make cli-release
        run: make cli-release VERSION="$TAG"
      - if: env.REHEARSAL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: bin/release/
          retention-days: 1
      - name: publish the release
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's generated notes cover everything since the previous release; with none yet they list
          # every PR ever merged and exceed the 125,000-character body limit (v0.1.0's first run failed so).
          notes=(--generate-notes)
          [ -n "$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[].tagName')" ] || notes=(--notes "The first release of the Canyon CLI.")
          pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease) # an rc is never releases/latest, which install.sh's one-liner reads
          # a draft until its images are on GHCR and pull (publish, below): a release is never visible without them
          gh release create "$TAG" bin/release/* --verify-tag --draft --title "canyon $TAG" "${notes[@]}" "${pre[@]}"

  images:
    # Each architecture on a runner of its own, natively: under QEMU the web and Go builds take many times as long.
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # push to ghcr.io/getcanyon-ai/canyon-*, which grants this repository write access
    steps:
      - name: the commit is on main, so only reviewed code is released
        env:
          GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: | # a blobless fetch of main into a scratch repository: the job's own checkout is never trusted for this
          set -euo pipefail
          git init -q --bare "$RUNNER_TEMP/onmain"
          git -C "$RUNNER_TEMP/onmain" fetch -q --filter=blob:none "$GH_REPO_URL" main
          git -C "$RUNNER_TEMP/onmain" merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_SHA is not on main: a release is cut from main alone"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the tag is a version
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG is not a version tag"; exit 1; }'
      - name: log in to ghcr.io with this job's own token
        if: env.REHEARSAL != 'true'
        env:
          GH_TOKEN: ${{ github.token }} # this step's alone; packages: write, gone when the job ends
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: build each image for linux/${{ matrix.arch }} and push it by digest, untagged
        if: env.REHEARSAL != 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx create --use >/dev/null # the docker driver cannot push by digest
          make images-release PLATFORM="linux/$ARCH" VERSION="$TAG" REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" SOURCE="https://github.com/$GITHUB_REPOSITORY"
      - name: log out of ghcr.io, whatever the push did
        if: always()
        run: docker logout ghcr.io
      - name: rehearsal, build each image for linux/${{ matrix.arch }} to its digest and push nothing
        if: env.REHEARSAL == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx create --use >/dev/null # as the release's builder
          make images-release PUSH=false PLATFORM="linux/$ARCH" VERSION="$TAG" REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" SOURCE="https://github.com/$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: bin/images/
          retention-days: 1

  publish-images:
    needs: [release, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload
      packages: write # the multi-arch index and its tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests # digests/digests-amd64/<name>, digests/digests-arm64/<name>
      - name: log in to ghcr.io with this job's own token
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: join each image's two architectures under one digest, tag it, and attach images.txt to the draft
        env:
          GH_TOKEN: ${{ github.token }} # the draft release here
        run: |
          for name in $(ls digests/digests-amd64); do # make images-release wrote one file per image, named for it
            repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$name
            docker buildx imagetools create -t "$repo:$TAG" "$repo@$(cat "digests/digests-amd64/$name")" "$repo@$(cat "digests/digests-arm64/$name")"
            digest=$(docker buildx imagetools inspect "$repo:$TAG" --format '{{json .Manifest}}' | jq -er .digest)
            echo "$repo@$digest" >> images.txt
          done
          [ "$(wc -l < images.txt)" -eq 9 ] || { echo "::error::images.txt names $(wc -l < images.txt) images, not 9"; exit 1; }
          cat images.txt
          gh release upload "$TAG" images.txt -R "$GITHUB_REPOSITORY"
      - name: log out of ghcr.io, whatever the join did
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.txt
          retention-days: 1

  pull-images:
    # What an operator does with images.txt, on each architecture: every image pulls by its digest and
    # is that architecture's. Nothing is built; a pull that fails keeps the release a draft.
    needs: publish-images
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images
      - name: pull every image in images.txt by digest for linux/${{ matrix.arch }}, with no login, as a user does
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          [ "$(wc -l < images.txt)" -eq 9 ] || { echo "::error::images.txt names $(wc -l < images.txt) images, not 9"; exit 1; }
          while read -r ref; do
            docker pull -q --platform "linux/$ARCH" "$ref"
            got=$(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$ref")
            [ "$got" = "linux/$ARCH" ] || { echo "::error::$ref pulled as $got, not linux/$ARCH"; exit 1; }
            echo "$ref  $got"
          done < images.txt

  publish:
    needs: pull-images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write # gh release edit
    steps:
      - name: publish the release, now that every image pulls on both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"

  canyon-releases-pack:
    # The release's files for canyon-releases, packed and checked by the tree's scripts, with no secret.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read # this repository's release and tag
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag, which the chart and the bundle are packed from
      - name: helm, the pinned release, checksum-verified
        env:
          HELM_VERSION: v4.0.5
          HELM_SHA256: 206a7747702d13994a93629eaed4259bd9d0aec6e23ca52d640f47f7edfdc863 # linux-arm64 of HELM_VERSION, as helm.yml's; bump both together
        run: |
          set -euo pipefail
          .github/fetch.sh "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz" "$HELM_SHA256" "$RUNNER_TEMP/helm.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/bin" linux-arm64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: pack and check the release's files, and check every image pulls with no login
        env:
          SOURCE_TOKEN: ${{ github.token }} # reads this repository's release
        run: PUBLISH_OUT="$RUNNER_TEMP/canyon-releases" scripts/publish-release.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: canyon-releases
          path: ${{ runner.temp }}/canyon-releases/
          retention-days: 1

  canyon-releases:
    # The release on getcanyon-ai/canyon-releases, from the packed files: the only job with a secret, and it checks
    # nothing out and runs none of the tree's code.
    needs: canyon-releases-pack
    if: github.event_name == 'push' && github.repository == 'getcanyon-ai/canyon'
    environment: release # CANYON_RELEASES_TOKEN, which only a v* tag may use
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: the commit is on main, so only reviewed code is released
        env:
          GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git init -q --bare "$RUNNER_TEMP/onmain"
          git -C "$RUNNER_TEMP/onmain" fetch -q --filter=blob:none "$GH_REPO_URL" main
          git -C "$RUNNER_TEMP/onmain" merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD ||
            { echo "::error::$GITHUB_SHA is not on main: a release is cut from main alone"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: canyon-releases
          path: canyon-releases
      - name: create the release on getcanyon-ai/canyon-releases
        env:
          GH_TOKEN: ${{ secrets.CANYON_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::the release environment has no CANYON_RELEASES_TOKEN: nothing was published"; exit 1; }
          [ -s canyon-releases/notes.md ] && [ -n "$(ls canyon-releases/assets)" ] || { echo "::error::the packed release is incomplete: nothing was published"; exit 1; }
          pre=(); [ -e canyon-releases/prerelease ] && pre=(--prerelease)
          gh release create "$TAG" canyon-releases/assets/* -R getcanyon-ai/canyon-releases --title "canyon $TAG" --notes-file canyon-releases/notes.md "${pre[@]}"

  smoke:
    needs: canyon-releases
    uses: ./.github/workflows/release-smoke.yml
    with:
      tag: ${{ github.ref_name }}

  rehearse:
    needs: [release, images]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: helm, the pinned release, checksum-verified
        env:
          HELM_VERSION: v4.0.5
          HELM_SHA256: 206a7747702d13994a93629eaed4259bd9d0aec6e23ca52d640f47f7edfdc863 # linux-arm64 of HELM_VERSION, as helm.yml's; bump both together
        run: |
          set -euo pipefail
          .github/fetch.sh "https://get.helm.sh/helm-$HELM_VERSION-linux-arm64.tar.gz" "$HELM_SHA256" "$RUNNER_TEMP/helm.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/bin" linux-arm64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: assets
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
      - name: images.txt from the built digests, then the release's files packed and checked, publishing nothing
        run: |
          set -euo pipefail
          for name in $(ls digests/digests-amd64); do echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$name@$(cat "digests/digests-amd64/$name")"; done > assets/images.txt
          [ "$(wc -l < assets/images.txt)" -eq 9 ] || { echo "::error::the rehearsal built $(wc -l < assets/images.txt) images for amd64, not 9"; exit 1; }
          [ "$(ls digests/digests-arm64 | wc -l)" -eq 9 ] || { echo "::error::the rehearsal built $(ls digests/digests-arm64 | wc -l) images for arm64, not 9"; exit 1; }
          PUBLISH_ASSETS=assets PUBLISH_REF="$GITHUB_SHA" scripts/publish-release.sh "$TAG"
