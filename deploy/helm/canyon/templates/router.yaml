{{- /* deploy/k8s/router.yaml: replicas, image and resources from values. nginx.conf is the base's, so
     its canyon.nginx-conf-sha256 annotation stays true. */}}
# The router every app address reaches through one wildcard Ingress: both forms, always, without knowing the domain — a host whose second label is preview or
# prod is <app>.<target>.<domain>, any other <app>-<target>.<domain> — to <app>-<target> in canyon-apps
# on 4180, the one port an app's policy admits, from pods labelled canyon.front-door alone. Like Canyon's
# own proxy on a single host it caps no body and buffers nothing. An app it cannot reach gets a page that
# says why, styled as the sidecar's sign-in page: a Service that does not resolve (nothing deployed
# there, so no upstream address) is 404, one that resolves and does not answer is 502; an app's own
# answers pass through. Its health answers on a port of its own, so no app's /health is shadowed.
apiVersion: v1
kind: ConfigMap
metadata: {name: canyon-router, namespace: canyon}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      resolver kube-dns.kube-system.svc.cluster.local valid=10s;
      map $host $canyon_app {
        "~^(?<app>[a-z]([a-z0-9-]*[a-z0-9])?)\.(?<target>preview|prod)\." "${app}-${target}";
        "~^(?<app>[a-z]([a-z0-9-]*[a-z0-9])?)-(?<target>preview|prod)\." "${app}-${target}";
        default "";
      }
      map $http_upgrade $connection_upgrade { default upgrade; "" close; }
      server {
        listen 8080;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        location / {
          if ($canyon_app = "") { return 404; }
          proxy_pass http://$canyon_app.canyon-apps.svc.cluster.local:4180;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_connect_timeout 10s;
          proxy_read_timeout 60s;
          proxy_send_timeout 60s;
          error_page 502 504 = @unreachable;
        }
        location @unreachable {
          default_type text/html;
          if ($upstream_addr = "") { return 404 "<!doctype html><html lang='en'><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>No app here</title><p style='font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5'>No app is running at this address. It may have been deleted, or never deployed here.</p></html>\n"; }
          return 502 "<!doctype html><html lang='en'><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>App not answering</title><p style='font-family: system-ui, sans-serif; max-width: 36rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5'>This app isn't answering right now. It may be starting, or it may have stopped.</p></html>\n";
        }
      }
      server {
        listen 8081;
        location = /health { return 200 "OK"; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: canyon-router, namespace: canyon}
spec:
  replicas: {{ .Values.canyon.router.replicas }}
  selector: {matchLabels: {app.kubernetes.io/name: canyon-router}}
  template:
    # nginx.conf's sha256: a changed config changes the template, so an apply rolls the router (a subPath
    # mount never sees a ConfigMap update).
    metadata:
      labels: {app.kubernetes.io/name: canyon-router, canyon.front-door: "true"}
      annotations: {canyon.nginx-conf-sha256: 14d95c171643ccddad5c57b4c4950503e992e05e888c4fa103e2dd17b3794d8f}
    spec:
      serviceAccountName: canyon-router
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: nginx
          image: {{ include "canyon.image" (dict "root" . "name" "router") }}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: tmp, mountPath: /tmp}
          resources: {{- toYaml .Values.canyon.router.resources | nindent 12 }}
          livenessProbe: {httpGet: {path: /health, port: 8081}, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /health, port: 8081}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - {name: config, configMap: {name: canyon-router}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: canyon-router, namespace: canyon}
spec:
  selector: {app.kubernetes.io/name: canyon-router}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
# In: 8080, from the load balancer in front of it. Out: DNS, and 4180 of the apps' pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: canyon-router, namespace: canyon}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: canyon-router}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: canyon-apps}}}]
      ports: [{protocol: TCP, port: 4180}]
