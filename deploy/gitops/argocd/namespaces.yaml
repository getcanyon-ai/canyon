# Each app environment's namespace, from the platform's own repo (design/HAND-OFF.md §3b, §10): one Application per
# canyon.json the app ApplicationSets find, its one source the chart in ${PLATFORM_PATH} of ${PLATFORM_REPO_URL}, which
# renders exactly the Namespace canyon-<app>-<env> with Pod Security baseline. Only the name comes from the deploy repo's
# path; the content never does, so a token that can write the deploy repo can never choose a namespace's pod security.
# Its AppProject may make Namespaces and nothing else, from the platform repo alone, for Applications in Argo CD's own
# namespace alone (no sourceNamespaces, no roles); the app projects (appprojects.yaml) make no cluster-scoped object.
# goTemplate substitutes a path segment into each string field as data, never as template text.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: canyon-namespaces
  namespace: argocd
spec:
  description: The namespaces of Canyon's apps, from the platform repo
  sourceRepos:
    - ${PLATFORM_REPO_URL}
  destinations: # Canyon's app namespaces alone, never its own canyon-apps or canyon-egress
    - server: https://kubernetes.default.svc
      namespace: canyon-*-preview
    - server: https://kubernetes.default.svc
      namespace: canyon-*-prod
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
  namespaceResourceBlacklist:
    - {group: "*", kind: "*"}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: canyon-namespaces
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git: # the preview branch alone, its own environment's files alone: a preview commit never makes a prod namespace
        repoURL: ${REPO_URL}
        revision: ${PREVIEW_BRANCH}
        files:
          - path: ${ROOT}/*/preview/canyon.json
        requeueAfterSeconds: ${REQUEUE_SECONDS}
        values:
          env: preview
    - git:
        repoURL: ${REPO_URL}
        revision: ${PROD_BRANCH}
        files:
          - path: ${ROOT}/*/prod/canyon.json
        requeueAfterSeconds: ${REQUEUE_SECONDS}
        values:
          env: prod
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'canyon-{{ index .path.segments ${APP_SEGMENT} }}-{{ .values.env }}-ns'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: canyon-namespaces
      source:
        repoURL: ${PLATFORM_REPO_URL}
        targetRevision: ${PLATFORM_REVISION}
        path: ${PLATFORM_PATH}
        helm:
          # Structured values, never parameters: helm's --set would read a comma or a dot in a directory's name as
          # another value. The chart checks app as a DNS label and env as preview or prod, and makes the name.
          valuesObject:
            app: '{{ index .path.segments ${APP_SEGMENT} }}'
            env: '{{ .values.env }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'canyon-{{ index .path.segments ${APP_SEGMENT} }}-{{ .values.env }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
