name: Missing feature
description: Something Canyon doesn't do yet.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do, and what stops you today
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
  - type: input
    id: category
    attributes:
      label: What Canyon said it doesn't support
      description: Filled in when you came from Canyon's "Not supported yet" line.
  - type: dropdown
    id: where
    attributes:
      label: Where Canyon runs
      options:
        - The demo on a laptop (docker compose)
        - Kubernetes
        - The demo Helm chart
        - Somewhere else (say where above)
  - type: input
    id: version
    attributes:
      label: Canyon version
      description: The output of `canyon --version`.
  - type: input
    id: os
    attributes:
      label: Operating system
