# Which CPU architecture a Kubernetes app is built for and runs on (#2440): one real build and /run through the
# executor on kind, and a /run of an image of the other architecture, on an arm64 runner and on an amd64 one
# (.github/kind/build-arch.sh readies kpack; the tests are executor/kube's TestBuildOnKindRunsWhereItsAppRuns and
# TestAnImageOfTheOtherArchitectureWaitsForItsOwnNodes). Slow, so a pull request runs it only when the build or run
# path or this check changes, and by hand.
name: build-arch

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths: # which of this workflow's suites the pull request's change reaches (.github/suites): every suite on any other event
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    outputs:
      build-arch: ${{ steps.reach.outputs.build-arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its base, which reach.sh diffs
      - id: reach
        run: .github/suites/reach.sh build-arch

  kind:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.build-arch == 'true' # a stack suite: never on a fork's pull request, which runs the fast checks alone
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci:private')) && '["amd64"]' || '["arm64", "amd64"]') }} # under ci:private, arm64 is the private runners' build-arch suite; amd64 runs only here
    name: kind (a build on ${{ matrix.arch }})
    # arm64 on our own VMs (AGENTS.md, Commands), a fork's on GitHub's arm runner; amd64 on GitHub's, as executor-e2e
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || ((vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache # before setup-go, as kube.yml's
        with:
          job: kube
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - if: runner.environment == 'github-hosted'
        name: free the runner's disk, as kube.yml's kind job does
        run: |
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done
          docker image prune -af >/dev/null &
          wait
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: .github/kind/up.sh calico
        env:
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
      - run: .github/kind/build-arch.sh
      - name: a real build and /run through the executor, every test listed run and passed
        run: |
          go test -tags kube -count=1 -timeout 45m -v -run '^(TestBuildOnKindRunsWhereItsAppRuns|TestAnImageOfTheOtherArchitectureWaitsForItsOwnNodes)$' ./executor/kube | tee "$RUNNER_TEMP/build-arch.txt"
          for t in TestBuildOnKindRunsWhereItsAppRuns TestAnImageOfTheOtherArchitectureWaitsForItsOwnNodes; do # a test renamed away runs nothing and passes
            grep -q -- "--- PASS: $t" "$RUNNER_TEMP/build-arch.txt"
          done
        env:
          CANYON_KUBE_TEST_PUSH: localhost:5001
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -40
          kubectl -n kpack logs deploy/kpack-controller --tail=80 || true
