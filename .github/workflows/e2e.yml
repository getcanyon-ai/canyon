# The expensive jobs: the executor image and a real buildpack build of the fixture app. They
# prove things only the executor, the fixture app, the compose stack or the pack pin can
# change, so they run only when one of those does. Everything else is CI (ci.yml).
name: e2e

on:
  pull_request:
    paths:
      - 'executor/**'
      - 'gate/testdata/apps/**'
      - 'Dockerfile'
      - 'Dockerfile.executor'
      - 'docker-compose.yml'
      - 'Makefile'
      - 'go.mod'
      - '.github/workflows/e2e.yml'
      - '.github/pack-download-test.py'
      - '.github/fetch.sh'
  push: # main re-runs nothing a pull request ran (#2173): it only writes executor-e2e's build cache, once per go.sum
    branches: [main]
    paths:
      - 'go.sum'
      - '.github/actions/go-cache/**'
      - '.github/workflows/e2e.yml' # its push leg runs once whenever it changes

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-build:
    if: github.event_name == 'pull_request'
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's; Dockerfile.executor carries pack's arm64 pin
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  pack-download: # pack's release download outlives GitHub's 504s and still checks the pin, in make pack-fetch and Dockerfile.executor alike (#2755)
    if: github.event_name == 'pull_request'
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/pack-download-test.py

  executor-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # a stack suite: never on a fork's pull request, which runs the fast checks alone
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # canyon-arm-ondemand: our own arm64 VMs, on demand for a long job (AGENTS.md, Commands); a fork's pull request stays on GitHub's; the builder, paketobuildpacks/ubuntu-noble-builder, is multi-arch (#1025)
    timeout-minutes: 45 # ten real buildpack builds, a stock Next 16 among them (#1240), and the Paketo samples' image scans (#2216): the test step ran 23 min
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/dns-evidence # GitHub's hosted runners: dockerd's debug log, for the DNS evidence below
        with:
          step: start
      - if: github.event_name == 'pull_request'
        name: free the runner's disk — ten app builds, canyon-run and the scanners' images need more than it leaves
        run: |
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done # in parallel: serially this was 80 s
          docker image prune -af >/dev/null &
          wait
          df -h /
      - name: Docker's classic image store — pack's builds ran ~2x slower into Docker 29's containerd store (#2609)
        if: runner.environment == 'self-hosted' # GitHub's runners are on it already
        run: |
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          test "$(docker info --format '{{.Driver}}')" = overlay2
      - uses: ./.github/actions/go-cache # before setup-go: restoring the module cache over the toolchain setup-go just fetched collides (tar: File exists)
        with:
          job: executor-e2e
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # .github/actions/go-cache instead: main writes, a pull request reads
      - if: github.event_name == 'pull_request'
        run: make pack-install
        env:
          GH_TOKEN: ${{ github.token }} # an authenticated release download, sent to github.com alone (#2755)
      - if: github.event_name == 'pull_request'
        run: make test-e2e
      - if: github.event_name == 'push' # what make test-e2e compiles, into the build cache go-cache saves for pull requests
        run: go test -tags e2e -count=1 -run '^$' ./executor
      - uses: ./.github/actions/dns-evidence # GitHub's hosted runners: what DNS did, when a build's lookup failed
        if: failure()
        with:
          step: collect
