# One ApplicationSet per branch (design/HAND-OFF.md §3b, §10): each finds the canyon.json files of its own
# environment alone, on its own branch, and makes one Application per app. The project and the namespace come from
# this template and the path, never from canyon.json, so a file on the preview branch can never reach production.
# The namespace is never made here: namespaces.yaml makes it from the platform repo, and an app's first sync retries
# until it is there.
# ${APP_SEGMENT} is the path segment that names the app: the number of segments in ${ROOT} (1 for apps).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: canyon-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: ${REPO_URL}
        revision: ${PREVIEW_BRANCH}
        files:
          - path: ${ROOT}/*/preview/canyon.json
        requeueAfterSeconds: ${REQUEUE_SECONDS}
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'canyon-{{ index .path.segments ${APP_SEGMENT} }}-preview'
      labels:
        canyon.dev/env: preview
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: canyon-preview
      source:
        repoURL: ${REPO_URL}
        targetRevision: ${PREVIEW_BRANCH}
        path: '{{ .path.path }}'
        directory:
          recurse: true
          exclude: canyon.json
      destination:
        server: https://kubernetes.default.svc
        namespace: 'canyon-{{ index .path.segments ${APP_SEGMENT} }}-preview'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true # an undeploy of an app with no resources/ leaves canyon.json alone: nothing to apply, everything to prune
        retry: # until the namespace's own Application has made the namespace (namespaces.yaml)
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: canyon-prod
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: ${REPO_URL}
        revision: ${PROD_BRANCH}
        files:
          - path: ${ROOT}/*/prod/canyon.json
        requeueAfterSeconds: ${REQUEUE_SECONDS}
  syncPolicy:
    preserveResourcesOnDeletion: false
  template:
    metadata:
      name: 'canyon-{{ index .path.segments ${APP_SEGMENT} }}-prod'
      labels:
        canyon.dev/env: prod
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: canyon-prod
      source:
        repoURL: ${REPO_URL}
        targetRevision: ${PROD_BRANCH}
        path: '{{ .path.path }}'
        directory:
          recurse: true
          exclude: canyon.json
      destination:
        server: https://kubernetes.default.svc
        namespace: 'canyon-{{ index .path.segments ${APP_SEGMENT} }}-prod'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: true # an undeploy of an app with no resources/ leaves canyon.json alone: nothing to apply, everything to prune
        retry: # until the namespace's own Application has made the namespace (namespaces.yaml)
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
