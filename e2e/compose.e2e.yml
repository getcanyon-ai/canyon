# The E2E stack (make e2e-up): docker compose -f docker-compose.yml -f e2e/compose.e2e.yml. The shipped
# file is never edited for tests. Relative paths resolve against the first file's directory, the repo root.
services:
  server:
    # The module proxy each image's go mod download asks: CI's list, which asks it again on any error (.github/actions/
    # go-cache, #2533), else Go's default. Every image this stack builds from the repository's Dockerfiles takes it.
    build:
      args:
        <<: &goproxy
          GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOTAGS: e2e # trusts the licence key e2e/fixtures/gen.sh makes for each run, so the journeys run licensed (#2879)
    environment:
      - CANYON_TELEMETRY=0 # CI's environment never reaches the server: Canyon's own stacks send no report (#2807)
      - CANYON_LICENSE=/etc/canyon/licence/canyon.licence # gen.sh's, signed by its key: every Enterprise feature (#2879)
      - CANYON_GITHUB_API=http://stub:8080/gh
      - CANYON_PROVISIONERS=/etc/canyon/provisioners/adapter.json # postgres builtin in preview, the stub's adapter in prod; s3 the adapter in both
    volumes:
      - ./e2e/provisioners:/etc/canyon/provisioners:ro
      - ./e2e/.work/fixtures/licence:/etc/canyon/licence:ro
  stub: # the Anthropic Messages API, GitHub's API under /gh, the provisioner adapter under /adapter (e2e/stub)
    build: ./e2e/stub
    volumes:
      - ./e2e/provisioners:/run/canyon/provisioners:ro
      - ./e2e/.work/fixtures:/fixtures:ro # e2e/fixtures/gen.sh's output: repo r's tarball is fixtures/r.tar.gz
      - ./e2e/.work/log:/log # requests.jsonl, read by the journeys from the host
    ports:
      - "127.0.0.1:8090:8080" # the journeys' POST /_control
    networks: [canyon-internal]
  # An adapter URL is https or loopback (contracts/provisioner.md "Trust"), so the adapter is reached on
  # the server's own 127.0.0.1:8099: socat in the server's network namespace, forwarding to the stub.
  # A killed server takes the namespace with it: restart this after the server.
  adapter:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:8099,bind=127.0.0.1,fork,reuseaddr", "TCP:stub:8080"]
    network_mode: service:server
    depends_on: [server, stub]
  # Stand-in resolvers beside a real one, which e2e/egress_test.go stands up: a public one (203.0.113.9) and a private one
  # (192.168.188.9) the floor admits on 53, and the server's address (10.214.3.2), inside Canyon's pools, which it never does.
  egress:
    environment:
      - &egress-resolvers CANYON_EGRESS_RESOLVERS=8.8.8.8,203.0.113.9,192.168.188.9,10.214.3.2
      - CANYON_EGRESS_PER_SOURCE=8 # a cap e2e/egress_test.go reaches cheaply, one source holding it kept alive
    # Names for e2e/egress_test.go's stand-ins and the server, which Envoy, sharing the holder's /etc/hosts, resolves:
    # the check refuses an IP literal, so a call that must reach one names it. Here alone, never in the shipped file
    # (deploy/egress/compose_test.go).
    extra_hosts:
      - "public.canyon-floor.test:198.51.100.9"
      - "unlisted.canyon-floor.test:198.51.100.9"
      - "verify.canyon-floor.test:198.51.100.9" # e2e/intercept_test.go's TLS stand-in, which no root in Envoy's image signs (#2757)
      - "mismatch.canyon-floor.test:198.51.100.9" # the same stand-in, under a certificate for another name (#2760)
      - "private.canyon-floor.test:10.250.87.9"
      - "server.canyon-floor.test:10.214.3.2"
      - "host.canyon-floor.test:198.51.100.200" # the Docker host's own, on its loopback: the egress job puts it there before the stack starts (#2524)
      - "echo.canyon-floor.test:192.88.99.9" # e2e/echo, under the test CA the gateway trusts here (#2144)
      - "echo-untrusted.canyon-floor.test:192.88.99.9" # the same echo, under a CA nothing trusts
    networks:
      canyon-e2e-echo: {} # where the gateway reaches e2e/echo: internal, so it adds no route out
  egress-envoy: # resolves through what the holder admits; 8.8.8.8 first, the one that answers outside the tests
    environment:
      - *egress-resolvers
    # The gateway's upstream trust in the stack alone: its image's roots and e2e/echo's test CA, which make e2e-up writes
    # (e2e/fixtures/egress-trust.sh), over the file the shipped bootstrap names. No setting of the product's adds a CA.
    volumes:
      - ./e2e/.work/fixtures/egress-trust.pem:/etc/ssl/certs/ca-certificates.crt:ro
  # The outside service injected calls reach (e2e/echo; #2144, #2146): HTTPS and gRPC Health/Check, answering what
  # reached it, at 192.88.99.9 on a network of its own, a /24 no test stands one up on and the floor admits.
  echo:
    build: ./e2e/echo
    volumes:
      - ./e2e/.work/fixtures:/fixtures:ro # gen.sh's echo.crt and echo-untrusted.crt, and their keys
    networks:
      canyon-e2e-echo:
        ipv4_address: 192.88.99.9
  # Where the scanner databases' refreshes download from: unset, trivy's and grype's own. CI's stacks name sources
  # that never resolve and start with the databases already in place (.github/actions/scan-dbs), so none downloads
  # one live.
  executor:
    build:
      args: *goproxy
    environment:
      - CANYON_SCANDB_TRIVY=${CANYON_SCANDB_TRIVY:-}
      - CANYON_SCANDB_TRIVY_JAVA=${CANYON_SCANDB_TRIVY_JAVA:-}
      - CANYON_SCANDB_GRYPE=${CANYON_SCANDB_GRYPE:-}
  egress-control:
    build:
      args: *goproxy
  # A second Canyon, for J14 (e2e/host_test.go, e2e/oidc/host_test.go, design/OPERATIONS.md §2.5): sign-in off on its own
  # loopback, its own Postgres, no executor, since the guards refuse before anything runs. Off serves this machine
  # alone, so canyon-b-door, in its network namespace, carries the published port to that loopback, as adapter
  # does for the server; the CLI reaches it at http://localhost:7779.
  canyon-b:
    build:
      context: .
      args: *goproxy
    environment:
      - CANYON_TELEMETRY=0 # as the server's
      - CANYON_AUTH=off
      - CANYON_DATABASE_URL=postgres://canyon:canyon@postgres-b:5432/canyon?sslmode=disable
      - CANYON_PUBLIC_URL=http://localhost:7779
    ports:
      - "127.0.0.1:7779:7790" # canyon-b-door's
    depends_on:
      postgres-b:
        condition: service_healthy
    networks: [canyon-b]
  canyon-b-door:
    image: alpine/socat:1.8.0.3
    command: ["TCP-LISTEN:7790,fork,reuseaddr", "TCP:127.0.0.1:7777"]
    network_mode: service:canyon-b
    depends_on: [canyon-b]
  postgres-b:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # the server's
    environment: # local defaults on a network of its own, as the server's
      - POSTGRES_USER=canyon
      - POSTGRES_PASSWORD=canyon
      - POSTGRES_DB=canyon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U canyon -d canyon"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [canyon-b]

networks:
  canyon-b: {}
  canyon-e2e-echo:
    name: canyon-e2e-echo
    internal: true
    ipam:
      config:
        - subnet: 192.88.99.0/24
