# The contributor licence agreement (CLA.md): a pull request's opener and authors each sign it once, by the comment
# below, and the check stays red until they have. internal/tools/claguard is the check: it reads every page of the
# pull request's commits, matches signatures by account id, and passes a pull request into main alone. Signatures
# are a JSON file on this repository's cla-signatures branch, written with the workflow's own GITHUB_TOKEN: no
# other token. claguard makes the branch with the first signature, holding that file alone; it stays outside the
# main ruleset, which protects the default branch alone. It runs only in the public repository,
# getcanyon-ai/canyon, and on GitHub's runners: pull_request_target runs with this repository's token on a fork's
# pull request, so it checks out and runs this branch's code, never the pull request's (#39).
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    # edited: a pull request moved to main from another base, where the check is red, is checked again. Every edit
    # runs the whole check: a run skipped for a title edit would pass the required check.
    types: [opened, synchronize, reopened, edited]

permissions:
  actions: write # runs the pull request's check again after a signature or a recheck
  contents: write # the signatures file on the cla-signatures branch, nothing else
  pull-requests: write # the check's comment on the pull request

jobs:
  cla:
    # Dependabot's own pull requests are skipped, by the account that opened them (a skipped required check passes):
    # its commits are its own, and it can't sign.
    if: >-
      github.repository == 'getcanyon-ai/canyon' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.issue.user.login != 'dependabot[bot]' &&
      (github.event_name == 'pull_request_target' ||
       (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-24.04
    # A pull request's comment runs take turns, one at a time; a pull request's own runs each go at once.
    concurrency:
      group: ${{ github.event_name == 'issue_comment' && format('cla-comment-{0}', github.event.issue.number) || format('cla-{0}', github.run_id) }}
    steps:
      # GITHUB_SHA: the default branch's commit, on pull_request_target as on issue_comment, whatever the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0, node24
        with:
          go-version-file: go.mod
          cache: false
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./internal/tools/claguard
