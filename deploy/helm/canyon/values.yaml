# Canyon's Helm values. Every setting of the install lives here; https://www.getcanyon.ai/docs/self-host/helm/ explains them.
# Secrets: every secret value may be left empty. The chart then generates it once and keeps it across
# upgrades (read back from the live Secret), or takes it from an existingSecret where one is offered.

global:
  domain: ""              # required: apps live at <app>.preview.<domain> / <app>.prod.<domain>
  podCIDR: 10.42.0.0/16   # the pod network; NetworkPolicies match in-cluster databases by it (after DNAT)
  storageClass: ""        # "" = the cluster's default StorageClass

# Every image by digest; the chart refuses to render one without. Canyon's own are public at
# ghcr.io/getcanyon-ai, each digest in the release's images.txt: {repository: ghcr.io/getcanyon-ai/<name>, digest: "sha256:..."}.
images:
  server: {repository: "", digest: ""}        # canyon-server
  executorKube: {repository: "", digest: ""}  # canyon-executor-kube
  identity: {repository: "", digest: ""}      # canyon-identity, the app sidecar
  run: {repository: "", digest: ""}           # canyon-run, the stack's run image every app runs on
  build: {repository: "", digest: ""}         # canyon-build, the stack's build image every app builds on
  router: {repository: docker.io/nginxinc/nginx-unprivileged, digest: "sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8"}
  envoy: {repository: "docker.io/envoyproxy/envoy:v1.39.3", digest: "sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865"} # Canyon's egress gateway, deploy/k8s/egress.yaml's pin
  # Optional executor images (CANYON_IMAGE_*), each "repo@sha256:..." or "" for the executor's own pin.
  opengrep: ""             # ghcr.io/getcanyon-ai/canyon-opengrep@sha256:... from images.txt; empty answers no_image, which blocks a review with Opengrep on
  eslint: ""               # ghcr.io/getcanyon-ai/canyon-eslint@sha256:... from images.txt; the same for ESLint
  oauth2Proxy: ""
  busybox: ""
  busyboxStatic: ""
  trivy: ""
  grype: ""
  checkov: ""
  # Used by the chart's own hooks.
  kubectl: {repository: registry.k8s.io/kubectl, digest: "sha256:b8d523e7b8cdc5e3caa0f8891ee9f504abf137dec786e6e0ddd33e4f272c2f13"}
  python: {repository: docker.io/library/python, digest: "sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4"}
  registry: {repository: docker.io/library/registry, digest: "sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373"}
  postgres: {repository: docker.io/library/postgres, digest: "sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea"}
  pocketId: {repository: ghcr.io/pocket-id/pocket-id, digest: "sha256:323e7ef5bfacf7cf32f22f3d10ccdf48e0c97c94d67e7e40b0b996830deb5165"}
  caddy: {repository: docker.io/library/caddy, digest: "sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52"}

canyon:
  publicURL: ""           # default https://<global.domain>
  # Secret canyon/canyon-server holds the server's environment but CANYON_AUTH, which the chart pins to
  # oidc. Set existingSecret to bring your own instead (then everything below that becomes an env var is
  # ignored, except publicURL; a CANYON_AUTH in it is overridden).
  existingSecret: ""
  auth:
    mode: oidc            # CANYON_AUTH: oidc only; the chart refuses to render off and demo
    admins: []            # CANYON_ADMINS (required under oidc)
    allowedEmails: []     # CANYON_OIDC_ALLOWED_EMAILS
    allowedDomains: []    # CANYON_OIDC_ALLOWED_DOMAINS
    adminClaim: ""        # CANYON_ADMIN_CLAIM + CANYON_ADMIN_VALUE, both or neither
    adminValue: ""
    responderClaim: ""    # CANYON_RESPONDER_CLAIM + CANYON_RESPONDER_VALUE, both or neither: security responders
    responderValue: ""
    groupsClaim: ""       # CANYON_GROUPS_CLAIM
  oidc:                   # empty issuer with auth.pocketId.enabled = the bundled Pocket ID's `canyon` client
    issuer: ""
    clientId: ""
    clientSecret: ""
  org: ""                 # CANYON_ORG
  database:
    url: ""               # CANYON_DATABASE_URL; empty with infra.canyonPostgres.enabled = the bundled one. Your own: sslmode=verify-full with sslrootcert, or require at the least (no sslmode or prefer is TLS or nothing, allow refuses to start)
    cidr: ""              # server egress[3] on 5432; default podCIDR for the bundled one
  appDatabase:
    enabled: true         # the built-in provisioner (CANYON_APP_DATABASE_URL)
    url: ""               # empty with infra.appPostgres.enabled = the bundled one. Your own: sslmode=verify-full with sslrootcert, or require at the least, as database.url
    cidr: ""              # server egress[4] and the executor's CANYON_KUBE_DB_CIDRS; default podCIDR
    caConfigMap: ""       # a ConfigMap in canyon with key ca.crt → CANYON_APP_DATABASE_CA_FILE
  kubeAPI:
    cidrs: []             # server egress[5] on 443 and 6443, where the server reads the key set the egress gateway's token is checked against: the API server's endpoint addresses (kubectl get endpoints kubernetes; on EKS, the cluster's subnets, as the endpoints move) AND the kubernetes Service's cluster IP as a /32 (kubectl get svc kubernetes -o jsonpath='{.spec.clusterIP}'), as some CNIs match before kube-proxy rewrites it (EKS's VPC CNI) and others after; empty, platform.k3s.apiServer on k3s, else the render fails: the gateway would never be ready
  model:                  # all empty = no model, AI review skipped
    provider: ""          # CANYON_MODEL_PROVIDER: anthropic | openai
    model: ""
    url: ""
    anthropicApiKey: ""
    token: ""
    openaiApiKey: ""
  extraEnv: {}            # any other server variable, e.g. {CANYON_OSV_URL: ..., CANYON_GITHUB_API: ...}
  egress:                 # the token Canyon's egress gateway sends the server's receiver: Secret canyon/canyon-egress, key token, which both read
    token: ""             # 32 to 512 of [A-Za-z0-9._~+/=-]; MUST be set (or existingSecret) under helm template and GitOps; empty, generated once and kept by lookup on helm install/upgrade
    existingSecret: false # true: you created canyon/canyon-egress yourself, and the chart renders none (a new token then rolls nothing: restart both)
    # Sign-in for apps routed through the egress gateway, when your provider isn't public (https://www.getcanyon.ai/docs/self-host/kubernetes/,
    # Install for production, step 3). Those calls are not recorded.
    signin:
      hosts: []           # CANYON_KUBE_SIGNIN_DIRECT: "<host>=<address>/32" outside the cluster, "<host>" inside it
      # A provider inside the cluster: the canyon-apps-signin NetworkPolicy admits routed pods to its own pods
      # on this port, e.g. {namespace: idp, podLabels: {app.kubernetes.io/name: keycloak}, port: 8443}. Never an
      # ingress's or gateway's pods, which serve everything else too; the chart refuses the namespaces it writes
      # or installs into (Canyon's, Caddy's, Pocket ID's, kpack's, headlamp's) and kube-system.
      inCluster: {namespace: "", podLabels: {}, port: 0}
    # egress-control's Prometheus metrics on 7784 (https://www.getcanyon.ai/docs/self-host/configuration/): the gateway's NetworkPolicy admits
    # this namespace, your scraper's, and no other. Unset, a placeholder no namespace is named, so none scrapes it.
    # canyon-apps, canyon-builds and canyon-scans, where code Canyon did not write runs, are refused.
    metrics:
      namespace: REPLACE-scraper-namespace
  scanConcurrency: 10     # CANYON_SCAN_CONCURRENCY: the scans the cluster runs at once
  buildConcurrency: 4     # CANYON_BUILD_CONCURRENCY
  patchConcurrency: 2     # CANYON_PATCH_CONCURRENCY, beta: Canyon's platform patches at once, while patching is "on"
  patching: "off"         # CANYON_PATCHING, beta, "on" or "off" quoted: on, Canyon rebases and redeploys preview on its own, and puts the image back if the patched app exits or restarts in its watch
  server:
    storage: 10Gi         # the sealing key and package store: kept on uninstall, back it up
    resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}
  executor:
    registry: ""          # CANYON_KUBE_REGISTRY; default the bundled registry's <clusterIP>:5000
    scanDB: {trivy: "", grype: "", trivyJava: "", cidrs: []}   # CANYON_SCANDB_TRIVY / _GRYPE / _TRIVY_JAVA / CANYON_KUBE_SCANDB_CIDRS
    scanImageMax: ""      # CANYON_SCAN_IMAGE_MAX, 8Gi unset: the largest image an image scan reads
    serviceAccountAnnotations: {}               # e.g. eks.amazonaws.com/role-arn for ECR
    builds: ""            # CANYON_EXECUTOR_BUILDS, 6 unset; keep at or above buildConcurrency plus patchConcurrency
    scans: ""             # CANYON_EXECUTOR_SCANS, 14 unset; keep at or above scanConcurrency plus patchConcurrency plus two
    appCPURequest: ""     # CANYON_KUBE_APP_CPU_REQUEST, 10m unset
    appMemoryRequest: ""  # CANYON_KUBE_APP_MEMORY_REQUEST, 256Mi unset
    resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
  router:
    replicas: 2
    resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
  builder:
    tag: ""               # where kpack pushes the builder; default <executor registry>/canyon-builder
    # Secret canyon-builds/canyon-registry, kpack's push credential (not needed for an anonymous registry
    # or on ECR, where the executor writes it): a .dockerconfigjson value, or a Secret you made.
    registryCredential: {dockerConfigJson: "", existingSecret: false}
    stack:
      id: io.buildpacks.stacks.noble   # its build and run images are images.build and images.run
    buildpacks:           # store source image and order group id, in order
      - {id: paketo-buildpacks/ruby, image: docker.io/paketobuildpacks/ruby@sha256:f390bd757f1d3db374f9fec35e274fbbdc822aa37a318ece46a9d58ad010ddde}
      - {id: paketo-buildpacks/dotnet-core, image: docker.io/paketobuildpacks/dotnet-core@sha256:edc4d9456c4cd131b32c1b8c5153d182a1c8cfdc2631cd0f9d9f3d8c3f02a459}
      - {id: paketo-buildpacks/go, image: docker.io/paketobuildpacks/go@sha256:dfdadd182ef49e7aecb3d7d06fb78556322771b197b596033c41df9c013f7506}
      - {id: paketo-buildpacks/python, image: docker.io/paketobuildpacks/python@sha256:f63bb55db737a068e6ee5bc782392a8eeb72c8a253c9b58ab106e162001b3729}
      - {id: paketo-buildpacks/php, image: docker.io/paketobuildpacks/php@sha256:5689f7b91548da58276367e9072b014c324bcff017bc7e32cf454ffde34b9a25}
      - {id: paketo-buildpacks/web-servers, image: docker.io/paketobuildpacks/web-servers@sha256:4d04b87be1b46e303167b78fa389b90343d369a64444d5bc8ef1fb72a147eb41}
      - {id: paketo-buildpacks/java-native-image, image: docker.io/paketobuildpacks/java-native-image@sha256:600dd5d0b775d5f755c2cd6d06f6d8263748aee9d22dbc89c46ba19a98310301}
      - {id: paketo-buildpacks/java, image: docker.io/paketobuildpacks/java@sha256:1431100daf37f54fdecc120646ee7e02992099bd768feafde4b5c43618a16ccf}
      - {id: paketo-buildpacks/nodejs, image: docker.io/paketobuildpacks/nodejs@sha256:c9206489678dfb781fe1426bbb8abe1eb5e8fe46a9d99efd41b53803e8c6bd92}
      - {id: paketo-buildpacks/procfile, image: docker.io/paketobuildpacks/procfile@sha256:b1ba859292c4b622682ccd4f787a52cd8c66b6da5c75ccfc2923e021d6fe3478}

# How people reach apps. The bootstrap hook applies it with PUT /api/v1/front-door, signed in as the
# first Pocket ID admin, so it needs auth.pocketId.enabled; Canyon probes it and audits the change.
frontDoor:
  enabled: true
  choice: 2               # 1 = your gateway passes its sign-in token, 2 = Canyon's oauth2-proxy signs in
  domain: ""              # default global.domain
  form: app.env.domain    # app.env.domain | app-env.domain
  forceUpdate: false      # PUT even when unchanged, e.g. after rotating signin.clientSecret
  signin:                 # choice 2; empty issuer = the bundled Pocket ID's `canyon-apps` client
    issuer: ""
    clientId: ""
    clientSecret: ""
  gateway:                # choice 1
    kind: oidc            # oidc | alb
    issuer: ""
    audience: ""
    jwksURL: ""
    cookie: ""
    albArn: ""

# Optional keys for PUT /api/v1/preferences, the org's settings, e.g. {org_name: Acme}. Keys the
# environment pins (allowed_emails, ...) are refused there. Finishing setup is bootstrap.completeSetup.
preferences: {}

infra:
  registry:
    enabled: true
    clusterIP: 10.43.254.10   # pinned: containerd pulls from <clusterIP>:5000 (registries.yaml on k3s)
    storage: 20Gi
  # Demo only: the two bundled Postgres servers below have no backups. Production uses your own (deploy/k8s).
  canyonPostgres:
    enabled: true
    password: ""
    existingSecret: ""        # a Secret in canyon-infra with key `password`
    storage: 10Gi
  appPostgres:
    enabled: true
    password: ""
    existingSecret: ""
    storage: 10Gi

kpack:
  enabled: true               # kpack v0.18.0; its CRDs are always installed from crds/

auth:
  pocketId:
    enabled: true
    host: auth                # served at https://<host>.<global.domain>
    encryptionKey: ""         # losing it makes Pocket ID's database unreadable
    staticApiKey: ""
    existingSecret: ""        # a Secret in canyon-auth with ENCRYPTION_KEY and STATIC_API_KEY
    storage: 1Gi
    group: canyon-users       # the only group allowed to use the two clients
    users: []                 # [{username, email, firstName, lastName}], all Pocket ID admins and in group
    clients:                  # ids and secrets are fixed here, so Canyon's config is known at install
      canyon: {id: canyon, secret: ""}
      canyonApps: {id: canyon-apps, secret: ""}

gateway:
  enabled: true               # Caddy on 80/443 (Service type LoadBalancer), HTTP-01 certificates
  hosts:
    canyon: ""                # default global.domain (the apex)
    headlamp: k8s             # → k8s.<domain>; only with headlamp.enabled
  storage: 1Gi
  # The token Caddy asks Canyon's /tls/ask with before each certificate (Secrets canyon/canyon-tls-ask and
  # canyon-gateway/caddy-tls-ask). Empty: generated once and kept by lookup. Under Argo CD, or anything that
  # renders with helm template, set it: lookup sees nothing there, so every render would make a new one.
  # 32 to 512 of [A-Za-z0-9._~-], as `openssl rand -hex 32` writes; a new one rolls Caddy and the server.
  askToken: ""

headlamp:
  enabled: false              # a k3s HelmChart object (needs k3s's helm-controller)
  chartVersion: 0.45.0

# Extra egress k3s needs (the Helm guide's Platform notes): the executor to the API server, builds to the in-cluster
# registry, and server/apps/bootstrap to Caddy, because the bundled hosts resolve to the node itself.
platform:
  k3s:
    enabled: false
    apiServer: ""             # the node address the API server answers on (port 6443)

# Canyon's one report of counts a day, never names (TELEMETRY.md). It's on by default.
telemetry:
  enabled: true               # false sets CANYON_TELEMETRY=0 on the server: nothing is ever sent

bootstrap:
  enabled: true               # the post-install/upgrade Job: Pocket ID setup, front door, preferences
  printLoginLink: true        # print a one-time Pocket ID sign-in link for the first user in the Job log
  # Canyon starts in its setup state, where the front door cannot be set, until a person clicks Finish
  # (Canyon keeps that one click on purpose). true = the Job finishes setup itself, as the
  # first user, writing the same `complete setup` audit row.
  completeSetup: false
