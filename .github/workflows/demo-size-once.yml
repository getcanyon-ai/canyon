# Temporary, on this branch alone: which language a Node-only builder picks against today's builder, and what one
# small Node app costs on each. Nothing here is merged; the branch's last commit deletes it.
name: demo-size-once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: demo-size-once
  cancel-in-progress: true

jobs:
  run:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'exp/demo-size'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [today, nodeonly, cases]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: .github/demo-size/prepare.sh overlay2
      - uses: ./.github/actions/hosted-docker
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make pack-install
      - run: .github/demo-size/run.sh ${{ matrix.part }} "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.part }}
          path: ${{ runner.temp }}/out
          retention-days: 3
