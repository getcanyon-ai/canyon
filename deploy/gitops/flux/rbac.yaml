# Who Flux acts as (design/HAND-OFF.md §10). Never Flux's controllers, which are cluster-admin.
#
# The sync accounts, canyon-preview and canyon-prod in canyon-sync: each app's Kustomization applies as its
# environment's, which holds canyon-deploy, exactly the kinds the AppProjects list (argocd/appprojects.yaml) and no
# subresource, through a RoleBinding the generator makes in each app's namespace and nowhere else. Add the kinds your
# own templates make, and nothing else.
#
# The generator's account, canyon-namespaces in flux-system: the namespaces HelmReleases (generator.yaml) apply as it.
# It may make, change and delete namespaces and RoleBindings, bind canyon-deploy, write Kustomizations in canyon-sync
# and its Helm records in canyon-namespaces, and read the admission policy that bounds it; nothing in flux-system.
# Kubernetes RBAC scopes no create by name, so by RBAC alone it could bind canyon-deploy in any namespace and change
# or delete any namespace: admission.yaml holds it to Canyon's own names. Apply that policy with this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canyon-preview
  namespace: canyon-sync
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canyon-prod
  namespace: canyon-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyon-deploy
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [services, configmaps]
    verbs: ["*"]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: ["*"]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: ["*"]
  - apiGroups: [generators.external-secrets.io]
    resources: [passwords]
    verbs: ["*"]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: ["*"]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: ["*"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canyon-namespaces
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: canyon-namespaces
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [canyon-deploy]
    verbs: [bind]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    resourceNames: [canyon-namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: canyon-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: canyon-namespaces
subjects:
  - kind: ServiceAccount
    name: canyon-namespaces
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canyon-namespaces
  namespace: canyon-sync
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canyon-namespaces
  namespace: canyon-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canyon-namespaces
subjects:
  - kind: ServiceAccount
    name: canyon-namespaces
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canyon-namespaces
  namespace: canyon-namespaces
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canyon-namespaces
  namespace: canyon-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canyon-namespaces
subjects:
  - kind: ServiceAccount
    name: canyon-namespaces
    namespace: flux-system
