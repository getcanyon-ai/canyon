# The scanner databases of an E2E stack (#2496, #2510): trivy's, trivy's Java database and grype's. Before make
# e2e-up, each is the volume canyon-scandb-<tool>, where the executor's scans read it (executor/scan.go, toolDB),
# bound to the one copy cached a day as it was restored; and the stack's own refreshes are pointed at registries that never resolve
# (e2e/compose.e2e.yml passes CANYON_SCANDB_TRIVY, _TRIVY_JAVA and _GRYPE through), so no stack downloads one live
# and a stack that starts without one reds. A copy that does not read as a scan reads it is downloaded here, on the
# runner and outside the stack, with the images the executor pins, and saved: never a stack without one (dbs.sh).
#
# A day's first run: e2e-ui.yml's scan-dbs job fills the cache (fill: 'true'), once, while the stacks' jobs set
# up. A job whose restore misses waits for that job to finish and restores again, so ten runners do not download
# the same gigabyte at once; with no such job in its run, or none that saved, it downloads its own.
#
# With check: 'true', after the tests: red when a run waited on a database download, which the deploy log shows
# as "<tool>: downloading its vulnerability database", or a database no longer reads.
name: scan-dbs
description: the scanner databases of an E2E stack, from a daily cached copy, never downloaded live by the stack
inputs:
  check:
    description: "'true' after the tests: fail when a run waited on a database download, or one no longer reads"
    default: 'false'
  fill:
    description: "'true' in the one job that fills today's cache for its run's stacks: nothing to do when it is already there"
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.check != 'true'
      id: day
      shell: bash
      run: | # a copy a day, and a new one when dbs.sh changes how it keeps them
        day=$(date -u +%F)
        echo "day=$day" >> "$GITHUB_OUTPUT"
        echo "key=scan-dbs-$day-${{ hashFiles('.github/actions/scan-dbs/dbs.sh') }}" >> "$GITHUB_OUTPUT"
    - if: inputs.check != 'true'
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/canyon-scandb
        key: ${{ steps.day.outputs.key }}
        lookup-only: ${{ inputs.fill }}
    - if: inputs.check != 'true' && inputs.fill != 'true' && steps.cache.outputs.cache-hit != 'true'
      name: wait for the run's scan-dbs job, which fills today's cache
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for _ in $(seq 90); do # 15 minutes at most, its own timeout
          if ! status=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            -q '.jobs[] | select(.name == "scan-dbs" or (.name | endswith(" / scan-dbs"))) | .status'); then
            echo "::warning::the run's jobs could not be read (the job needs actions: read), so it downloads its own databases"
            exit 0
          fi
          echo "the scan-dbs job: ${status:-none in this run}"
          case ${status:-none} in none | completed) exit 0 ;; esac
          sleep 10
        done
    - if: inputs.check != 'true' && inputs.fill != 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/canyon-scandb
        key: ${{ steps.day.outputs.key }}
    - if: inputs.check != 'true' && !(inputs.fill == 'true' && steps.cache.outputs.cache-hit == 'true')
      id: seed
      shell: bash
      run: ${{ github.action_path }}/dbs.sh seed ~/.cache/canyon-scandb ${{ steps.day.outputs.day }}
    - if: steps.seed.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/canyon-scandb
        key: ${{ steps.day.outputs.key }}
    - if: inputs.check == 'true'
      name: no run waited on a scanner database download, and each database still reads
      shell: bash
      run: ${{ github.action_path }}/dbs.sh check ~/.cache/canyon-scandb
