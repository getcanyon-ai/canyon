name: docs

on:
  pull_request:
    paths: ['**.md', 'docs/**', 'contracts/**', 'designsystem/canyon/**', 'web/src/fonts/**', 'Makefile', 'scripts/publish-docs.sh', '.github/workflows/docs.yml', '.github/docs/**']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: lychee — the pinned release, checksum-verified
        env:
          LYCHEE_VERSION: v0.24.2
          LYCHEE_SHA256: 91a7bd65685da41b90ccb9bc867a3d649a7818042dae04ff405e55a25bddee4c # lychee-aarch64-unknown-linux-gnu.tar.gz of LYCHEE_VERSION; bump both together
          GH_TOKEN: ${{ github.token }} # its release downloads, authenticated on github.com alone (.github/fetch.sh)
        run: |
          set -euo pipefail
          .github/fetch.sh "https://github.com/lycheeverse/lychee/releases/download/lychee-$LYCHEE_VERSION/lychee-aarch64-unknown-linux-gnu.tar.gz" "$LYCHEE_SHA256" lychee.tar.gz
          sudo tar -xzf lychee.tar.gz --strip-components=1 -C /usr/local/bin lychee-aarch64-unknown-linux-gnu/lychee
      - run: make docs-links

  site:
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 15
    env:
      CANYON_PUBLIC_CHECK_NAMES: ${{ secrets.CANYON_PUBLIC_CHECK_NAMES }} # the names public-check refuses, hashed: never in the tree
      CANYON_PUBLIC_CHECK_FORK: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }} # a fork's pull request, and one Dependabot opened, get no secrets: their names are main's build's to check (#2895; Dependabot changes no page text)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: make docs-site # fails on a link to a page or heading that doesn't exist
      - uses: actions/upload-artifact@v4 # read the built site without deploying it: download, then npx serve
        with:
          name: docs-site
          path: docs/dist
          retention-days: 7
      - run: .github/docs/site-check.sh # every check of the built site, as Canyon's private runners run it too (scripts/ci-suite.sh docs); the last rewrites docs/'s pages
