# The store each release's ExternalSecret reads its access token from (design/HAND-OFF.md §5): Canyon's own route,
# GET /releases/<release>/access-token, under the fetch-only token, which opens that route and nothing else. Only
# Canyon's app namespaces, canyon-<app>-<preview|prod>, may read through it — never Canyon's own canyon-apps or
# canyon-egress; exclude canyon- namespaces from every other store you have, so a template can never read another
# team's secrets. The token is not bound to an app: any app namespace can fetch any app's newest access token
# (design/HAND-OFF.md §10, an accepted residual risk the tree check and the deny-all bound). The fetch-only token lives in the Secret canyon-fetch-token
# (key token) in external-secrets, labelled external-secrets.io/type: webhook (the webhook provider reads no other),
# filled from your own secret store, never from git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ${STORE}
spec:
  conditions:
    - namespaceRegexes:
        - "^canyon-.+-(preview|prod)$"
  provider:
    webhook:
      url: "${CANYON_URL}/releases/{{ .remoteRef.key }}/access-token"
      method: GET
      headers:
        Authorization: "Bearer {{ .auth.token }}"
      result:
        jsonPath: "$.value"
      secrets:
        - name: auth
          secretRef:
            name: canyon-fetch-token
            namespace: external-secrets
${CA_BUNDLE}
