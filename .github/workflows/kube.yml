# The executor on a real Kubernetes cluster (contracts/executor.md, invariants 10-11): the images built
# from this tree, deploy/k8s applied, and the kube-tagged tests against it — on kind with Calico, which
# enforces NetworkPolicy, and /probe alone on kind v0.23's kindnet, which does not. On Calico the hand-off
# journey (e2e/handoff) follows; the hand-off journey through a deploy repo runs beside it on a cluster of its own,
# on a pull request and on main, and Canyon under run_by: canyon on clusters of its own, Calico's and kindnet's
# (e2e/handoff/canyon_test.go). Slow, so it runs only when something it proves can change.
name: kube

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'executor/**'
      - 'cmd/canyon-executor-kube/**'
      - 'cmd/canyon-identity/**'
      - 'identity/**'
      - 'deploy/k8s/**'
      - 'deploy/egress/**'
      - 'deploy/helm/canyon/**'
      - 'deploy/helm/check-values.yaml'
      - 'Dockerfile.executor-kube'
      - 'Dockerfile.identity'
      - '.github/kind/**'
      - '.github/workflows/kube.yml'
      - 'e2e/handoff/**'
      - 'e2e/ui/handoff/**' # the journey's set-up in the dashboard (#2439), and what it clicks through
      - 'e2e/ui/playwright.config.ts'
      - 'web/src/screens/HandOff*'
      - 'web/src/screens/Settings.tsx'
      - 'web/src/api.ts'
      - 'web/src/strings.ts'
      - 'runs/release.go'
      - 'cmd/canyon-server/routes_release*.go'
      - 'cmd/canyon-server/routes_platform_webhook.go'
      - 'cmd/canyon-server/routes_platform_repo.go'
      - 'runs/repo.go'
      - 'runs/pipeline.go'
      - 'runs/durable.go'
      - 'contracts/**'
      - 'cmd/canyon-server/routes_preferences.go'
      - 'cmd/canyon-server/routes_envs.go' # undeploy
      - 'cmd/canyon-server/routes_projects.go' # delete
      - 'gitops/**' # the deploy repo's commits (#2470), and what Argo CD syncs from them
      - 'internal/gitpush/**'
      - 'deploy/gitops/**'
      - 'internal/egresscontrol/**' # the check beside Envoy, which the kind tests prove enforces (#2386)
      - 'internal/destination/**'
      - 'cmd/canyon-server/egress*.go'
      - 'cmd/canyon-server/routes_egress*.go'
      - 'cmd/canyon-server/routes_front_door.go'
      - 'db/migrations/**'
      - 'webhook/**'
      - 'go.mod'
      - 'Makefile'

permissions:
  contents: read

concurrency:
  group: kube-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # a PR's newer push cancels its older run; a main run always finishes

jobs:
  paths: # which of this workflow's suites the pull request's change reaches (.github/suites): every suite on any other event
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm"]') || 'ubuntu-24.04-arm' }} # canyon-arm: our own arm64 VMs (AGENTS.md, Commands); a fork's pull request stays on GitHub's
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # reach.sh reads the pull request's labels
    outputs:
      kind: ${{ steps.reach.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and its base, which reach.sh diffs
      - id: reach
        run: .github/suites/reach.sh kind
        env: # a labelled pull request of ours leaves its v1 suites to Canyon's private runners (reach.sh; CONTRIBUTING.md, Maintainers)
          GH_TOKEN: ${{ github.token }}
          CANYON_PRIVATE_AUTHOR: ${{ github.event_name == 'pull_request' && contains(fromJSON(vars.CANYON_PRIVATE_AUTHORS || '[]'), github.event.pull_request.user.login) }}

  kind:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.kind == 'true' # a stack suite: never on a fork's pull request, which runs the fast checks alone
    strategy:
      fail-fast: false
      # kindnet proves the probe says "not enforced" on a cluster without NetworkPolicy, and that under run_by: canyon
      # nothing builds there and the chart's bootstrap fails closed without failing the upgrade (#2514, #2516): on main
      # and on a pull request, beside it. A pull request runs Calico, the whole suite, which main never re-runs (#2173).
      # kindnet's run on main writes the kube build cache pull requests read.
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"network":"kindnet","network_policy":"not_enforced","run":"TestKindProbeTellsEnforcement"}]' || '[{"network":"calico","network_policy":"enforced","run":"TestKind"},{"network":"kindnet","network_policy":"not_enforced","run":"TestKindProbeTellsEnforcement"}]') }}
    name: kind (${{ matrix.network }})
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # canyon-arm-ondemand: our own arm64 VMs, on demand for a long job (AGENTS.md, Commands); a fork's pull request stays on GitHub's; kind, its node images, Calico and kpack are multi-arch, and kpack's controller is scaled to 0 here: this suite builds no app (build-arch.yml builds one on arm64 and on amd64)
    timeout-minutes: 50 # the journey builds the dashboard and installs Chromium (#2439)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache # before setup-go: restoring the module cache over the toolchain setup-go just fetched collides (tar: File exists)
        with:
          job: kube
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # .github/actions/go-cache instead: main writes, a pull request reads
      - if: runner.environment == 'github-hosted' # a fork's pull request; our own VMs have 100 GiB and none of these directories
        name: free the runner's disk — kind's images, two image builds and Calico need more than it leaves
        run: |
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done # in parallel: serially this was 150 s
          docker image prune -af >/dev/null &
          wait
          df -h /
      - if: matrix.network == 'calico'
        uses: actions/setup-node@v4 # the hand-off journey's set-up in the dashboard (e2e/ui), which ci-suite.sh installs
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/ui/package-lock.json
      - run: scripts/ci-suite.sh kind-${{ matrix.network }} # the suite's steps, as Canyon's private runners run them too
        env:
          GH_TOKEN: ${{ github.token }} # up.sh's and fetch.sh's release downloads, authenticated on github.com alone (.github/fetch.sh)

  canyon:
    # Canyon under run_by: canyon on Calico (#2514, #2516; e2e/handoff/canyon_test.go): the hand-off journey's stack on
    # this machine with the cluster's own executor, kpack readied as build-arch.yml readies it, so a deploy through the
    # server builds and runs, and the chart's bootstrap saves a door not enforcing again. A pull request's, as Calico's
    # suite; a cluster of its own, so it adds no time to that suite's.
    needs: paths
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.kind == 'true'
    name: kind (run_by canyon)
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # as the kind job's
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache # before setup-go: restoring the module cache over the toolchain setup-go just fetched collides (tar: File exists)
        with:
          job: kube
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # .github/actions/go-cache instead: main writes, a pull request reads
      - if: runner.environment == 'github-hosted' # a fork's pull request; our own VMs have 100 GiB and none of these directories
        name: free the runner's disk — kind's images, two image builds and Calico need more than it leaves
        run: |
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done # in parallel: serially this was 150 s
          docker image prune -af >/dev/null &
          wait
          df -h /
      - run: scripts/ci-suite.sh kind-canyon # the suite's steps, as Canyon's private runners run them too
        env:
          GH_TOKEN: ${{ github.token }} # up.sh's and fetch.sh's release downloads, authenticated on github.com alone (.github/fetch.sh)

  handoff-repo:
    needs: paths
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.paths.outputs.kind == 'true' # a stack suite: never on a fork's pull request, which runs the fast checks alone
    # The hand-off journey through a deploy repo (e2e/handoff/README.md; #2470): Calico's cluster, External Secrets and
    # CloudNativePG on it (.github/kind/platform.sh), Gitea beside it, and the deploy repo synced by each GitOps
    # controller deploy/gitops has a reference set-up for, Argo CD and Flux (#2479), each on a cluster of its own. A pull
    # request's, and main's after each merge, so a regression on main never waits for the next PR. Argo CD's keeps the
    # name it always had.
    strategy:
      fail-fast: false
      matrix:
        gitops: [argocd, flux]
    name: kind (hand-off, deploy repo${{ matrix.gitops == 'flux' && ', flux' || '' }})
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # as the kind job's
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-cache # before setup-go: restoring the module cache over the toolchain setup-go just fetched collides (tar: File exists)
        with:
          job: kube
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # .github/actions/go-cache instead: main writes, a pull request reads
      - if: runner.environment == 'github-hosted' # a fork's pull request; our own VMs have 100 GiB and none of these directories
        name: free the runner's disk — kind's images, two image builds and Calico need more than it leaves
        run: |
          df -h /
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do sudo rm -rf "$d" & done # in parallel: serially this was 150 s
          docker image prune -af >/dev/null &
          wait
          df -h /
      - uses: actions/setup-node@v4 # the hand-off journey's set-up in the dashboard (e2e/ui), which ci-suite.sh installs
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/ui/package-lock.json
      - run: scripts/ci-suite.sh handoff-${{ matrix.gitops }} # the suite's steps, as Canyon's private runners run them too
        env:
          GH_TOKEN: ${{ github.token }} # up.sh's and fetch.sh's release downloads, authenticated on github.com alone (.github/fetch.sh)