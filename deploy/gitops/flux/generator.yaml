# Each app environment's namespace, from the platform's own repo (design/HAND-OFF.md §3b, §10): one HelmRelease per
# environment renders the namespaces chart from its ArtifactGenerator's artifact (sources.yaml) as canyon-namespaces,
# the account admission.yaml bounds. For each <root>/<app>/<env>/canyon.json on the environment's branch it makes the
# namespace canyon-<app>-<env>, the RoleBinding that lets the environment's sync account apply there, and the
# Kustomization that applies the app's directory into it. An app's directory removed, Helm's next upgrade deletes all
# three: the namespace with everything in it, the database and its data among them. Only the paths come from the deploy
# repo; the chart, its values and this file are the platform's.
#
#   - disableWait: one app's Kustomization that is not Ready never holds another app's namespace.
#   - disableTakeOwnership: a path never adopts a namespace or Kustomization someone else made.
#   - RetryOnFailure: a failed upgrade is retried as it is, never rolled back or uninstalled, so a failure deletes
#     nothing; cleanupOnFail removes only what the failed attempt itself made, which holds no data yet.
#   - The release upgrades on every deploy, since canyon.json changes with each release: keep maxHistory low.
#
# Never delete one of these HelmReleases, rename its release, or change its targetNamespace or storageNamespace while
# apps run: Flux uninstalls it, which deletes every app namespace of that environment with its data.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: canyon-namespaces-preview
  namespace: flux-system
spec:
  releaseName: canyon-namespaces-preview
  chartRef:
    kind: ExternalArtifact
    name: canyon-namespaces-preview
  serviceAccountName: canyon-namespaces
  targetNamespace: canyon-namespaces
  storageNamespace: canyon-namespaces
  interval: ${INTERVAL}
  maxHistory: 3
  install:
    disableWait: true
    disableTakeOwnership: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    disableWait: true
    disableTakeOwnership: true
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
  values:
    env: preview
    root: "${ROOT}"
    interval: "${INTERVAL}"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: canyon-namespaces-prod
  namespace: flux-system
spec:
  releaseName: canyon-namespaces-prod
  chartRef:
    kind: ExternalArtifact
    name: canyon-namespaces-prod
  serviceAccountName: canyon-namespaces
  targetNamespace: canyon-namespaces
  storageNamespace: canyon-namespaces
  interval: ${INTERVAL}
  maxHistory: 3
  install:
    disableWait: true
    disableTakeOwnership: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    disableWait: true
    disableTakeOwnership: true
    cleanupOnFail: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  driftDetection:
    mode: enabled
  values:
    env: prod
    root: "${ROOT}"
    interval: "${INTERVAL}"
