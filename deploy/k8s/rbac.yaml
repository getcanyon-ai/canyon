# Who may do what. canyon-executor holds a Role in each of the
# three namespaces it writes to — exactly the calls the executor makes — and get on the ClusterBuilder
# canyon, and nothing else: no Role in canyon, so the server's Secrets are never its to mount. Secrets
# are created and deleted, never read. The server, the router, the egress gateway and the builds hold no
# Role at all.
apiVersion: v1
kind: ServiceAccount
metadata: {name: canyon-executor, namespace: canyon}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: canyon-server, namespace: canyon}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: canyon-router, namespace: canyon}
automountServiceAccountToken: false
---
# The egress gateway's: its pods' projected token, for the policy's audience alone, is what the server's policy
# listener takes.
apiVersion: v1
kind: ServiceAccount
metadata: {name: canyon-egress, namespace: canyon}
automountServiceAccountToken: false
---
# The Builds' account: kpack mounts canyon-registry in the prepare and export steps alone, so the app's
# own build scripts hold no registry credential; no role annotation, so no web identity either.
apiVersion: v1
kind: ServiceAccount
metadata: {name: canyon-build, namespace: canyon-builds}
automountServiceAccountToken: false
secrets: [{name: canyon-registry}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: canyon-executor, namespace: canyon-apps}
rules:
  - {apiGroups: [apps], resources: [deployments], verbs: [get, list, create, update, delete]} # list: POST /running
  - {apiGroups: [apps], resources: [replicasets], verbs: [list]} # a failed /run's own, before it opens a floored app's policy again
  - {apiGroups: [""], resources: [services, configmaps], verbs: [get, create, update, delete]}
  - {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, create, update, delete]}
  - {apiGroups: [""], resources: [secrets], verbs: [create, delete]}
  - {apiGroups: [""], resources: [serviceaccounts], verbs: [create, delete]} # each app env's own, its floored pods' token (#2142): never read or changed, no serviceaccounts/token, bound to nothing
  - {apiGroups: [""], resources: [pods], verbs: [list]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
  - {apiGroups: [batch], resources: [jobs], verbs: [create, delete]} # the probe's three pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: canyon-executor, namespace: canyon-builds}
rules:
  - {apiGroups: [kpack.io], resources: [builds], verbs: [create, delete, list, watch]}
  - {apiGroups: [""], resources: [pods], verbs: [get]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
  - {apiGroups: [""], resources: [secrets], verbs: [create, delete]} # canyon-registry, on ECR
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: canyon-executor, namespace: canyon-scans}
rules:
  - {apiGroups: [batch], resources: [jobs], verbs: [get, list, create, delete]}
  - {apiGroups: [""], resources: [pods], verbs: [list]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
  - {apiGroups: [""], resources: [pods/exec], verbs: [create]} # the scan's feed; SPDY is a POST
  - {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, create, update]}
  - {apiGroups: [""], resources: [persistentvolumeclaims], verbs: [get, create]}
  - {apiGroups: [apps], resources: [deployments], verbs: [create]} # trivy's server, canyon-trivy: a create names no object yet
  - {apiGroups: [apps], resources: [deployments], resourceNames: [canyon-trivy], verbs: [get, update]}
  - {apiGroups: [""], resources: [services], verbs: [create]}
  - {apiGroups: [""], resources: [services], resourceNames: [canyon-trivy], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: canyon-executor, namespace: canyon-apps}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: canyon-executor}
subjects: [{kind: ServiceAccount, name: canyon-executor, namespace: canyon}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: canyon-executor, namespace: canyon-builds}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: canyon-executor}
subjects: [{kind: ServiceAccount, name: canyon-executor, namespace: canyon}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: canyon-executor, namespace: canyon-scans}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: canyon-executor}
subjects: [{kind: ServiceAccount, name: canyon-executor, namespace: canyon}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: canyon-executor}
rules:
  - {apiGroups: [kpack.io], resources: [clusterbuilders], resourceNames: [canyon], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: canyon-executor}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: canyon-executor}
subjects: [{kind: ServiceAccount, name: canyon-executor, namespace: canyon}]
