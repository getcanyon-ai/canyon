apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    canyon.app: claims-portal
    canyon.target: preview
  name: claims-portal-preview
  namespace: canyon-claims-portal-preview
spec:
  ingress:
  - ports:
    - port: 4180
      protocol: TCP
  podSelector:
    matchLabels:
      canyon.app: claims-portal
      canyon.target: preview
  policyTypes:
  - Ingress
