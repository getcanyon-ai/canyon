# The Go caches for one job. main writes them; a pull request only reads main's. When every pull
# request saved its own copy (~800 MB each) the repo went past GitHub's 10 GB cache limit, main's
# copy was evicted, and every run built cold. When go.sum changes, a run restores the newest older
# copy (restore-keys) rather than building cold until main saves anew. The test job's build cache,
# which holds Go's test results, main saves on every push (the run id in its key; a key that exists
# is never saved again), so a pull request reuses the results of main's latest push, not those of
# the day go.sum last changed. One entry per push (~600 MB); every other job's is still once per go.sum.
#
# Two entries, not one per job: the module cache (~1.1 GB) is the same in every job, so it is saved
# once and restored by all of them; only the build cache (and golangci-lint's) differs per job. Each
# job used to save its own copy of both, three of them carrying the same module cache.
name: go-cache
description: Go caches — main writes them, a pull request reads main's
inputs:
  job:
    description: the job whose build cache this is (each job builds different things)
    required: true
  build:
    description: restore the job's build cache too; 'false' for a job that compiles nothing
    default: 'true'
  save:
    description: "'false' restores on main too and never saves: a job reading another job's cache, which that job alone writes"
    default: 'true'
runs:
  using: composite
  steps:
    # A module download proxy.golang.org cuts short (a stream error) fails the go command, and the job: GOPROXY's comma
    # falls back only on 404 and 410. Every later step of the job, a docker build passing it on included, asks the
    # proxy twice, then the source (goproxy.sh, #2533). A job that names its own GOPROXY keeps it.
    - shell: bash
      run: '[ -n "${GOPROXY:-}" ] || echo "GOPROXY=$("$GITHUB_ACTION_PATH/goproxy.sh" https://proxy.golang.org)" >> "$GITHUB_ENV"'
    - uses: actions/cache/restore@v4
      if: github.event_name == 'pull_request' || inputs.save == 'false'
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: go-mod-${{ runner.os }}-
    - uses: actions/cache@v4
      if: github.event_name != 'pull_request' && inputs.save != 'false'
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: go-mod-${{ runner.os }}-
    - uses: actions/cache/restore@v4
      if: (github.event_name == 'pull_request' || inputs.save == 'false') && inputs.build == 'true'
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: go-build-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ inputs.job == 'test' && github.run_id || 'go.sum' }}
        restore-keys: |
          go-build-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
          go-build-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/cache@v4
      if: github.event_name != 'pull_request' && inputs.save != 'false' && inputs.build == 'true'
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: go-build-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ inputs.job == 'test' && github.run_id || 'go.sum' }}
        restore-keys: |
          go-build-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
          go-build-${{ inputs.job }}-${{ runner.os }}-${{ runner.arch }}-
