# Argo CD's credential for the deploy repo: read-only, and never Canyon's token, which can write. On GitHub, a
# fine-grained token with Contents read, or a read-only deploy key, which takes this Secret's SSH form (an ssh:// url
# and sshPrivateKey); on Gitea or Forgejo, an access token with read:repository; on GitLab, a project access token
# with the Reporter role and read_repository, or a deploy token with read_repository alone.
apiVersion: v1
kind: Secret
metadata:
  name: canyon-deploy-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: ${REPO_URL}
  username: ${READ_USER}
  password: ${READ_TOKEN}
