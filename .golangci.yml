version: "2"

linters:
  default: standard
  enable:
    - gosec
  exclusions:
    rules:
      # gosec 2.28's G706 pairs a method's parameters with the wrong arguments when the method is
      # called through an interface (its fn.Params hold the receiver, an invoke's Args do not:
      # taint/taint.go, isParameterTainted), and every executor call goes through executor.Calls.
      - path: ^executor/
        linters:
          - gosec
        text: G706
      # qa/ is the operator's own test tool: every path it opens and the claude it starts are the
      # operator's arguments (qa/agent/README.md), so there is no untrusted input to taint them.
      - path: ^qa/
        linters:
          - gosec
        text: G204|G304|G703

formatters:
  enable:
    - gofmt
    - goimports
