# The latest released CLI against this tree's server (.github/old-cli.sh): what a server change does to the
# CLI people already have installed. It runs when the server can change: the packages canyon-server is
# built from (go list -deps ./cmd/canyon-server, less web/, which the CLI never reads), its images and
# the compose stack, and the demo apps it drives. Test files and prose change nothing the CLI talks to.
name: old-cli

on:
  pull_request:
    paths:
      - 'cmd/canyon-server/**'
      - 'cmd/canyon-executor/**' # every deploy goes through it
      - 'contracts/**'
      - 'db/**'
      - 'events/**'
      - 'executor/**'
      - 'gate/**'
      - 'github-app/**'
      - 'identity/**'
      - 'ingest/**'
      - 'internal/**'
      - 'provisioners/**'
      - 'runs/**'
      - 'vault/**'
      - 'webhook/**'
      - 'demo/apps/**' # the apps it checks, deploys and promotes
      - 'Makefile' # make demo-down
      - '.dockerignore'
      - 'Dockerfile'
      - 'Dockerfile.executor'
      - 'docker-compose.yml'
      - 'go.mod'
      - 'go.sum'
      - '.github/old-cli.sh'
      - '.github/workflows/old-cli.yml'
      - '!**.md'
      - '!**/*_test.go'

permissions:
  contents: read

concurrency:
  group: old-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  old-cli:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository # a stack suite: never on a fork's pull request, which runs the fast checks alone
    runs-on: ${{ (vars.CANYON_RUNNERS == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","canyon-arm-ondemand"]') || 'ubuntu-24.04-arm' }} # canyon-arm-ondemand: our own arm64 VMs, on demand for a long job (AGENTS.md, Commands); a fork's pull request stays on GitHub's; the stack's images and the release's CLI are both arm64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hosted-docker # GitHub's hosted runners: Docker resolves a build's lookups from the host (its action.yml)
      - run: .github/old-cli.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/dns-evidence # GitHub's hosted runners: what DNS did, when a build's lookup failed
        if: failure()
