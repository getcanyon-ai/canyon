{{- /* deploy/k8s/executor.yaml with values. One replica, Recreate: its locks and start-up sweeps assume it
     is alone. Its only ingress is the server's pods. */}}
{{- $c := .Values.canyon }}
{{- $dbCIDR := $c.appDatabase.cidr | default (ternary .Values.global.podCIDR "" (and $c.appDatabase.enabled .Values.infra.appPostgres.enabled)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canyon-executor
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: canyon-executor}}
  template:
    metadata: {labels: {app.kubernetes.io/name: canyon-executor}}
    spec:
      serviceAccountName: canyon-executor
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: executor
          image: {{ include "canyon.image" (dict "root" . "name" "executorKube") }}
          env:
            - {name: CANYON_KUBE_REGISTRY, value: {{ include "canyon.registry" . | quote }}}
            - {name: CANYON_IMAGE_IDENTITY, value: {{ include "canyon.image" (dict "root" . "name" "identity") | quote }}}
            - {name: CANYON_KUBE_DB_CIDRS, value: {{ $dbCIDR | quote }}}
            {{- range $var, $key := dict "CANYON_IMAGE_OPENGREP" "opengrep" "CANYON_IMAGE_ESLINT" "eslint" "CANYON_IMAGE_OAUTH2_PROXY" "oauth2Proxy" "CANYON_IMAGE_BUSYBOX" "busybox" "CANYON_IMAGE_BUSYBOX_STATIC" "busyboxStatic" "CANYON_IMAGE_TRIVY" "trivy" "CANYON_IMAGE_GRYPE" "grype" "CANYON_IMAGE_CHECKOV" "checkov" }}
            {{- with index $.Values.images $key }}
            - {name: {{ $var }}, value: {{ . | quote }}}
            {{- end }}
            {{- end }}
            {{- range $var, $v := dict "CANYON_EXECUTOR_BUILDS" $c.executor.builds "CANYON_EXECUTOR_SCANS" $c.executor.scans "CANYON_KUBE_APP_CPU_REQUEST" $c.executor.appCPURequest "CANYON_KUBE_APP_MEMORY_REQUEST" $c.executor.appMemoryRequest }}
            {{- with $v }}
            - {name: {{ $var }}, value: {{ . | toString | quote }}}
            {{- end }}
            {{- end }}
            {{- with $c.executor.scanDB.trivy }}
            - {name: CANYON_SCANDB_TRIVY, value: {{ . | quote }}}
            {{- end }}
            {{- with $c.executor.scanDB.grype }}
            - {name: CANYON_SCANDB_GRYPE, value: {{ . | quote }}}
            {{- end }}
            {{- with $c.executor.scanDB.trivyJava }}
            - {name: CANYON_SCANDB_TRIVY_JAVA, value: {{ . | quote }}}
            {{- end }}
            {{- with $c.executor.scanImageMax }}
            - {name: CANYON_SCAN_IMAGE_MAX, value: {{ . | quote }}}
            {{- end }}
            {{- with $c.executor.scanDB.cidrs }}
            - {name: CANYON_KUBE_SCANDB_CIDRS, value: {{ join "," . | quote }}}
            {{- end }}
            {{- with $c.egress.signin.hosts }}
            - {name: CANYON_KUBE_SIGNIN_DIRECT, value: {{ join "," . | quote }}}
            {{- end }}
          ports: [{name: http, containerPort: 7778}]
          readinessProbe: {tcpSocket: {port: 7778}}
          resources: {{- toYaml $c.executor.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: canyon-executor
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: canyon-executor}
  ports: [{name: http, port: 7778, targetPort: 7778}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canyon-executor
  namespace: canyon
  labels: {{- include "canyon.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: canyon-executor}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: canyon-server}}}]
      ports: [{protocol: TCP, port: 7778}]
  egress:
    {{- include "canyon.dnsEgress" . | nindent 4 }}
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: canyon-apps}}}] # canyon-identity's /answered, after each run
      ports: [{protocol: TCP, port: 4183}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: canyon-egress}}}] # the gateway check
      ports: [{protocol: TCP, port: 3128}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: canyon-scans}}, podSelector: {matchLabels: {canyon.trivy: "true"}}}] # trivy's server's /version: how old its database is (#2743)
      ports: [{protocol: TCP, port: 4954}]
