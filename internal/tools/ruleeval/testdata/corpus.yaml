  - id: huge-policy-essay
    category: adversarial
    text: |-
      Our engineering policy, which every app must follow. Services must be designed for reliability first: every external call has sensible retries with backoff, failures degrade gracefully rather than crash the process, and anything a user does that cannot be completed is explained to them in plain language. Data is handled with care: personal data is collected only where the feature needs it, retained no longer than the product requires, never written to logs, and encrypted wherever it rests outside the primary database. Authentication is never home-grown; authorization is checked on the server for every action that changes data, and admin-only actions check an admin role rather than trusting the client. Code is reviewed for clarity: functions do one thing, names say what things are, and comments explain why rather than what. Dependencies are chosen deliberately: prefer the standard library, avoid packages that are unmaintained, and never pull in a large framework for a small task. Performance matters where users feel it: pages render quickly on a mid-range phone, queries that run on every request use an index, and background work runs in the background. Accessibility is part of done: every interactive element can be reached and used with a keyboard, images that carry meaning have text alternatives, and colour is never the only way information is conveyed. Observability is built in from the start: errors are reported with enough context to reproduce them, and the health of the service can be seen without reading its source. Finally, apps are kept tidy: dead code is deleted, experiments are cleaned up once they end, and the README tells a newcomer how to run the app and where its important parts live.
    checker: ai
