name: hosted-dns
description: >-
  On GitHub's hosted runners, the runner's own resolver (systemd-resolved) also asks public resolvers, beside the
  one the runner's network hands it, so an app's build in the stack doesn't fail on a lookup that one drops
  ("lookup nodejs.org on 127.0.0.11:53: server misbehaving"). It changes the host's resolver, never Docker's: Docker
  forwards a container's lookups to that loopback resolver from the host, where a build's floor doesn't reach,
  while an upstream named in Docker's own dns setting would be asked from inside the build and refused there
  (executor/buildfloor.sh). On any other runner it does nothing.
runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/systemd/resolved.conf.d
        printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' | sudo tee /etc/systemd/resolved.conf.d/canyon-ci.conf >/dev/null
        sudo systemctl restart systemd-resolved
        resolvectl query --legend=no nodejs.org >/dev/null # the resolver answers again, or the job stops here
        resolvectl dns | sed 's/^/  /'
